  {"id": "fr-lion-et-rat", "langue": "fr", "emoji": "🦁", "palette": "or", "amb": "foret", "titre": "Le Lion et le Rat", "pages": [["Il était une fois un grand lion qui faisait la sieste à l’ombre d’un arbre.", "🦁"], ["Un petit rat, qui jouait à cache-cache, grimpa sans le vouloir sur le museau du lion.", "🐭"], ["Le lion ouvrit un œil. « Pardon, pardon ! dit le rat. Laisse-moi partir, et un jour je t’aiderai. »", "👀"], ["Le lion rit doucement : « Toi, si petit, m’aider ? » Mais il laissa le rat s’en aller.", "😊"], ["Quelques jours plus tard, le lion se prit dans un grand filet. Il ne pouvait plus bouger.", "🌳"], ["Le petit rat l’entendit. Il accourut et grignota les cordes, une à une, avec ses petites dents.", "🐭"], ["Le filet s’ouvrit, et le lion fut libre ! « Merci, mon ami. Même les petits peuvent faire de grandes choses. »", "🦁"], ["Depuis ce jour, le lion et le rat sont les meilleurs amis de la savane.", "🤝"], ["Le rat s’endort, tout blotti contre la crinière chaude du lion. Bonne nuit !", "🌙"]]},
  {"id": "fr-rat-des-villes-rat-des-champs", "langue": "fr", "emoji": "🐭", "palette": "maison", "amb": "maison", "titre": "Le Rat des villes et le Rat des champs", "pages": [["Il était une fois un rat des champs qui vivait dans un petit trou, au milieu des blés.", "🌾"], ["Un jour, son cousin le rat des villes vint le voir. Le rat des champs lui offrit des graines et du pain.", "🍞"], ["« C’est bien simple, ici ! dit le rat des villes. Viens chez moi, tu verras de bonnes choses ! »", "🏢"], ["En ville, sur une grande table, il y avait du fromage, des gâteaux et des fruits. Quel festin !", "🧀"], ["Mais soudain, la porte grinça et un chat miaula. Les deux rats coururent se cacher derrière le placard.", "🐱"], ["« Ton repas est délicieux, dit le rat des champs, mais je préfère manger tranquille. »", "🍎"], ["Il rentra chez lui, dans son petit trou calme, où l’on entend seulement le vent dans les blés.", "🏡"], ["Chacun aime sa maison : le rat des villes sa grande ville, et le rat des champs sa campagne paisible.", "💛"], ["Dans son lit de paille, le rat des champs ferme les yeux sous les étoiles. Bonne nuit !", "🌙"]]},
  {"id": "fr-gros-navet", "langue": "fr", "emoji": "🌱", "palette": "ferme", "amb": "ferme", "titre": "Le Gros Navet", "pages": [["Il était une fois un grand-père qui planta une petite graine de navet dans son jardin.", "🌱"], ["Le navet poussa, poussa… et devint énorme ! « Je vais le tirer ! » dit le grand-père. Mais le navet ne bougea pas.", "👴"], ["Le grand-père appela la grand-mère. Ils tirèrent tous les deux. Mais le navet ne bougea pas.", "👵"], ["La grand-mère appela leur petite-fille. Ils tirèrent tous les trois. Mais le navet ne bougea pas.", "👧"], ["La petite-fille appela le chien. Ils tirèrent tous les quatre. Mais le navet ne bougea pas.", "🐶"], ["Le chien appela le chat. Ils tirèrent tous les cinq. Mais le navet ne bougea toujours pas.", "🐱"], ["Le chat appela la petite souris. Ils tirèrent tous ensemble, très fort… et hop ! Le navet sortit de la terre !", "🐭"], ["Tout le monde tomba à la renverse en riant. Le soir, ils mangèrent une bonne soupe de navet tous ensemble.", "🍲"], ["Ensemble, on est plus forts. Le ventre bien rempli, chacun alla se coucher. Bonne nuit !", "🌙"]]},
  {"id": "fr-la-moufle", "langue": "fr", "emoji": "🧤", "palette": "luciole", "amb": "foret", "titre": "La Moufle", "pages": [["Il était une fois, dans la forêt enneigée, un grand-père qui perdit une moufle en ramassant du bois.", "🧤"], ["Une petite souris la trouva. « Quelle jolie maison bien chaude ! » Et elle se glissa dedans.", "🐭"], ["Une grenouille arriva. « Puis-je entrer ? » « Bien sûr ! » dit la souris. Et elles furent deux.", "🐸"], ["Puis un lapin, tout grelottant, demanda à entrer. On se serra un peu. Et ils furent trois.", "🐰"], ["Un renard et un loup vinrent aussi. On se serra encore. La moufle devenait toute ronde !", "🦊"], ["Enfin, un gros ours arriva. « Moi aussi, j’ai froid ! » Il se glissa dedans… et la moufle s’étira, s’étira !", "🐻"], ["Une toute petite fourmi voulut entrer à son tour. Crac ! Les coutures s’ouvrirent, et tout le monde roula dans la neige en riant.", "🐜"], ["Le grand-père retrouva sa moufle. Les animaux, eux, allèrent tous ensemble se blottir dans la tanière de l’ours.", "🏠"], ["Serrés les uns contre les autres, ils s’endormirent bien au chaud. Bonne nuit !", "🌙"]]},
  {"id": "fr-trois-petits-cochons", "langue": "fr", "emoji": "🐷", "palette": "ferme", "amb": "ferme", "titre": "Les Trois Petits Cochons", "pages": [["Il était une fois trois petits cochons qui voulaient chacun construire leur maison.", "🐷"], ["Le premier, pressé d’aller jouer, bâtit une maison de paille.", "🌾"], ["Le deuxième fit une maison de branches. Le troisième travailla longtemps pour bâtir une solide maison de briques.", "🧱"], ["Un loup arriva. Il souffla sur la maison de paille : fffou ! Elle s’envola. Le petit cochon courut chez son frère.", "🐺"], ["Le loup souffla sur la maison de branches : fffou ! Elle tomba. Les deux cochons coururent chez le troisième.", "🌳"], ["Le loup souffla, souffla, souffla sur la maison de briques. Mais elle ne bougea pas d’un pouce !", "🏠"], ["Tout essoufflé, le loup s’assit par terre. « Vous êtes plus malins que moi ! » Et il repartit dans la forêt.", "🌲"], ["Les trois frères aidèrent les deux premiers à bâtir de nouvelles maisons de briques, tout près les unes des autres.", "🧱"], ["Bien à l’abri, les trois petits cochons dorment comme des loirs. Bonne nuit !", "🌙"]]},
  {"id": "fr-petite-poule-rousse", "langue": "fr", "emoji": "🐔", "palette": "ferme", "amb": "ferme", "titre": "La Petite Poule rousse", "pages": [["Il était une fois une petite poule rousse qui vivait à la ferme avec un chat, un canard et un chien.", "🐔"], ["Un jour, elle trouva des grains de blé. « Qui veut m’aider à les planter ? » « Pas moi ! » dirent les autres.", "🌾"], ["« Alors je les planterai toute seule », dit la petite poule. Et le blé poussa, grand et doré.", "🌱"], ["« Qui veut m’aider à couper le blé ? » « Pas moi ! » dirent les autres. Alors elle le coupa toute seule.", "🐔"], ["« Qui veut m’aider à faire de la farine au moulin ? » « Pas moi ! » Alors elle y alla toute seule.", "🌀"], ["Avec la farine, elle fit un beau pain doré. Mmm, qu’il sentait bon ! « Qui veut m’aider à le manger ? »", "🍞"], ["« Moi ! Moi ! Moi ! » crièrent le chat, le canard et le chien. Puis ils baissèrent la tête, un peu honteux.", "🦆"], ["« La prochaine fois, nous t’aiderons ! » promirent-ils. La petite poule sourit et partagea son pain avec ses amis.", "💛"], ["Le lendemain, tous plantèrent le blé ensemble. Et ce soir, la ferme s’endort tranquille. Bonne nuit !", "🌙"]]},
  {"id": "fr-jacques-haricot-magique", "langue": "fr", "emoji": "🌱", "palette": "arcenciel", "amb": "ciel", "titre": "Jacques et le haricot magique", "pages": [["Il était une fois un garçon nommé Jacques qui vivait avec sa maman et leur vache blanche.", "🐄"], ["Un jour, Jacques échangea la vache contre trois haricots magiques. Sa maman soupira et jeta les haricots par la fenêtre.", "🏠"], ["Pendant la nuit, un haricot géant poussa jusqu’aux nuages ! Au matin, Jacques commença à grimper.", "🌱"], ["Tout en haut, au-dessus des nuages, se dressait un immense château.", "🏰"], ["Dans le château vivait un géant qui grondait très fort. Mais au fond, il était surtout très seul.", "👣"], ["Il avait une poule qui pondait des œufs d’or et une harpe qui chantait. Jacques demanda : « Pourquoi es-tu si grognon ? »", "🥚"], ["« Personne ne vient jamais me voir », dit le géant. Jacques lui proposa d’être son ami, et le géant sourit enfin.", "🤝"], ["Le géant offrit un œuf d’or à Jacques. Depuis, Jacques grimpe souvent pour écouter la harpe avec son grand ami.", "🎵"], ["Là-haut, dans les nuages, le géant et Jacques regardent la lune se lever. Bonne nuit !", "🌙"]]},
  {"id": "fr-bonhomme-pain-epice", "langue": "fr", "emoji": "🍪", "palette": "bonbon", "amb": "maison", "titre": "Le Petit Bonhomme de pain d’épice", "pages": [["Il était une fois une grand-mère qui fit un petit bonhomme de pain d’épice, avec des yeux en raisins.", "👵"], ["Quand elle ouvrit le four, le bonhomme sauta dehors et partit en courant ! « Attrape-moi si tu peux ! »", "🍪"], ["Il courut devant la vache. « Arrête-toi ! » meugla-t-elle. Mais il courait trop vite.", "🐄"], ["Il courut devant le cochon. « Arrête-toi ! » grogna-t-il. Mais il courait toujours plus vite.", "🐷"], ["Il arriva au bord d’une rivière. Un renard rusé lui dit : « Monte sur mon dos, je vais te faire traverser ! »", "🦊"], ["Mais le bonhomme était malin. « Non merci ! » Et il sauta sur une grande feuille qui flottait sur l’eau.", "🍃"], ["La feuille glissa doucement sur la rivière et le ramena… juste devant la maison de la grand-mère !", "🏠"], ["La grand-mère l’embrassa. « Tu m’as fait courir ! » Le bonhomme promit de rester à la maison, bien au chaud.", "💛"], ["Il s’installa dans une jolie boîte, sur un nid de sucre. Bonne nuit, petit bonhomme !", "🌙"]]},
  {"id": "fr-loup-et-sept-chevreaux", "langue": "fr", "emoji": "🐐", "palette": "maison", "amb": "maison", "titre": "Le Loup et les sept chevreaux", "pages": [["Il était une fois une maman chèvre qui avait sept petits chevreaux.", "🐐"], ["Un jour, elle partit au marché. « N’ouvrez à personne, dit-elle. Je reviendrai vite. »", "🧺"], ["Toc, toc ! « C’est maman ! » dit une grosse voix. « Non, maman a une voix douce ! » répondirent les chevreaux.", "🚪"], ["Le loup revint, les pattes blanchies de farine. Les chevreaux se trompèrent et ouvrirent la porte.", "🐺"], ["Vite, ils se cachèrent partout : sous la table, dans le lit, dans le placard, et le plus petit dans la grande horloge.", "⏰"], ["À ce moment, maman chèvre rentra. « Bêêê ! » cria-t-elle très fort. Le loup eut si peur qu’il s’enfuit dans la forêt.", "🌲"], ["Un à un, les chevreaux sortirent de leur cachette. Le plus petit sortit le dernier de l’horloge.", "🐐"], ["Maman chèvre les serra tous les sept dans ses bras. Et le loup ne revint jamais.", "💛"], ["Blottis contre leur maman, les sept chevreaux s’endormirent. Bonne nuit !", "🌙"]]},
  {"id": "fr-poule-aux-oeufs-d-or", "langue": "fr", "emoji": "🥚", "palette": "or", "amb": "ferme", "titre": "La Poule aux œufs d’or", "pages": [["Il était une fois un fermier et sa femme qui avaient une poule toute simple.", "🐔"], ["Un matin, dans le nid, ils trouvèrent un œuf… en or ! Il brillait comme le soleil.", "🥚"], ["Chaque matin, la poule pondait un nouvel œuf d’or. Le fermier était très content.", "🌞"], ["Mais bientôt, il devint impatient. « Un œuf par jour, c’est trop peu ! Je veux tous les œufs tout de suite ! »", "😠"], ["Il courut après la poule dans toute la cour. La poule, effrayée, s’envola sur le toit et ne pondit plus rien.", "🏠"], ["Le fermier s’assit, tout penaud. « J’ai été trop gourmand. Pardon, petite poule. »", "😔"], ["Il lui prépara un nid tout doux et lui donna du bon grain. La poule redescendit, rassurée.", "🌾"], ["Le lendemain, il y avait de nouveau un œuf d’or. Le fermier dit merci, et apprit à être patient.", "💛"], ["Dans son nid douillet, la poule ferme les yeux. Bonne nuit !", "🌙"]]},
  {"id": "fr-vilain-petit-canard", "langue": "fr", "emoji": "🦢", "palette": "mer", "amb": "mer", "titre": "Le Vilain Petit Canard", "pages": [["Il était une fois, au bord d’un étang, une maman cane qui couvait ses œufs.", "🦆"], ["Crac, crac ! Les canetons sortirent un à un. Mais le dernier était grand, gris et pas comme les autres.", "🥚"], ["« Qu’il est vilain ! » disaient les canards de la ferme. Le petit se sentait tout triste.", "😢"], ["Alors il partit tout seul, sur les chemins et les étangs, à la recherche d’un ami.", "🌾"], ["L’hiver arriva. Le petit canard trouva refuge chez un vieux pêcheur qui le garda bien au chaud.", "🏠"], ["Au printemps, il vit de grands oiseaux blancs glisser sur l’eau. « Qu’ils sont beaux ! » soupira-t-il.", "🌸"], ["Il se pencha sur l’eau… et vit son reflet : il était devenu un magnifique cygne blanc !", "🦢"], ["Les cygnes l’accueillirent comme un frère. Il avait enfin trouvé sa famille.", "💛"], ["Chacun grandit à sa façon. Le jeune cygne s’endort, la tête sous son aile. Bonne nuit !", "🌙"]]},
  {"id": "en-goldilocks", "langue": "en", "emoji": "🐻", "palette": "foret", "amb": "foret", "titre": "Goldilocks and the Three Bears", "pages": [["Once upon a time, three bears lived in a little house in the woods: Papa Bear, Mama Bear and little Baby Bear.", "🐻"], ["One morning, their porridge was too hot. “Let’s go for a walk while it cools,” said Mama Bear.", "🥣"], ["A little girl called Goldilocks found the house. The door was open, so she went inside.", "🏠"], ["She tasted the porridge. The big bowl was too hot, the middle bowl was too cold, but the little bowl was just right!", "🥄"], ["Then she felt sleepy. She tried the beds upstairs. The little bed was just right, and she fell fast asleep.", "🛌"], ["The three bears came home. “Someone has been eating my porridge!” said Baby Bear. “And someone is sleeping in my bed!”", "🐾"], ["Goldilocks woke up with a jump. “Oh, I’m so sorry!” she said. “I should have asked first.”", "👧"], ["The bears smiled. They made a new pot of porridge and ate it all together, just right.", "🍯"], ["Then Goldilocks skipped home to her own cozy bed. Good night!", "🌙"]]},
  {"id": "en-gingerbread-man", "langue": "en", "emoji": "🍪", "palette": "or", "amb": "maison", "titre": "The Gingerbread Man", "pages": [["Once upon a time, a little old woman baked a gingerbread man with raisin eyes and a cherry smile.", "🍪"], ["When she opened the oven, he jumped out and ran away! “Run, run, as fast as you can! You can’t catch me, I’m the Gingerbread Man!”", "🏃"], ["The old woman ran after him. The old man ran after him too. But he was too fast!", "👵"], ["He ran past a cow in the field. “Moo! Stop!” said the cow. But the Gingerbread Man kept running.", "🐄"], ["He ran past a horse. “Neigh! Stop!” said the horse. But the Gingerbread Man ran even faster.", "🐴"], ["Then he came to a wide river. “Oh no! I can’t swim,” he said. A fox came by. “Hop on my back, I’ll carry you across.”", "🦊"], ["The kind fox swam slowly across the river, and the Gingerbread Man stayed nice and dry.", "🌊"], ["On the other side, he was tired of running. “Thank you, Fox. I think I’ll walk home now.”", "🚶"], ["The old woman gave him a warm hug, and he slept in a cozy cookie tin. Good night!", "🌙"]]},
  {"id": "en-jack-beanstalk", "langue": "en", "emoji": "🌱", "palette": "jardin", "amb": "ciel", "titre": "Jack and the Beanstalk", "pages": [["Once upon a time, a boy named Jack lived with his mother. They were very poor and had only one old cow.", "🐄"], ["Jack traded the cow for five magic beans. His mother sighed and threw the beans out of the window.", "✨"], ["That night, the beans grew and grew into a giant beanstalk, all the way up to the clouds!", "🌱"], ["Jack climbed up, up, up. At the top, he found a huge castle in the sky.", "🏰"], ["Inside lived a giant. “Fee-fi-fo-fum!” he boomed. But he was not angry. He was only lonely.", "👣"], ["Jack sat with the giant and told him funny stories. The giant laughed so hard the clouds shook!", "⛅"], ["“Thank you, friend,” said the giant. He gave Jack a hen that laid golden eggs.", "🐔"], ["Jack climbed down and shared the golden eggs with his mother and the whole village.", "🥚"], ["Every night, Jack waved to the giant in the sky, and the giant waved back. Good night!", "🌙"]]},
  {"id": "en-tortoise-hare", "langue": "en", "emoji": "🐢", "palette": "jardin", "amb": "jardin", "titre": "The Tortoise and the Hare", "pages": [["Once upon a time, there was a hare who was very, very fast. “Nobody can beat me!” he said.", "🐇"], ["A slow little tortoise said, “Let’s have a race.” All the animals laughed.", "🐢"], ["Ready, steady, go! The hare zoomed off and was soon far, far ahead.", "🏁"], ["“That tortoise is so slow,” said the hare. “I have time for a little nap.” He lay down under a tree.", "🌳"], ["The tortoise kept going. Step, step, step. Slow and steady, he never stopped.", "🐾"], ["The hare woke up and ran as fast as he could. But the tortoise was already crossing the finish line!", "🏆"], ["“Well done,” said the hare with a smile. “Slow and steady wins the race.”", "🤝"], ["That night, the two friends shared a big carrot and watched the stars. Good night!", "🥕"]]},
  {"id": "en-lion-mouse", "langue": "en", "emoji": "🦁", "palette": "or", "amb": "soir", "titre": "The Lion and the Mouse", "pages": [["Once upon a time, a big lion was sleeping in the warm sun.", "🦁"], ["A tiny mouse ran over his nose by mistake. The lion woke up and caught her in his paw.", "🐭"], ["“Please let me go,” squeaked the mouse. “One day I will help you.” The lion laughed. “You? So small?”", "🐾"], ["But he was kind, and he let the little mouse go.", "💛"], ["One day, the lion got stuck in a hunter’s net. He could not get out.", "🪢"], ["The little mouse heard him. She ran to the net and nibbled the ropes, one by one.", "🐁"], ["Snip, snap! The lion was free! “Thank you, little friend,” he said.", "🌟"], ["From then on, the lion and the mouse were best friends. Even little friends can be a big help. Good night!", "🌙"]]},
  {"id": "en-boy-cried-wolf", "langue": "en", "emoji": "🐑", "palette": "ferme", "amb": "ferme", "titre": "The Boy Who Cried Wolf", "pages": [["Once upon a time, a shepherd boy looked after the sheep on a green hill.", "🐑"], ["He was bored. So he shouted, “Wolf! Wolf!” just for fun.", "📣"], ["The villagers ran up the hill to help. But there was no wolf. The boy laughed.", "🏃"], ["The next day, he did it again. “Wolf! Wolf!” The villagers came, but there was no wolf. They were not happy.", "🌄"], ["Then one evening, a real wolf came out of the woods. “Wolf! Wolf!” cried the boy. But nobody came.", "🐺"], ["The sheep ran away into the trees, and the wolf ran after them into the dark forest.", "🌲"], ["The boy was sad. “I’m sorry,” he told the villagers. “I will always tell the truth now.”", "😢"], ["Together they searched and found every sheep, safe and sound. The boy kept his promise. Good night!", "🌙"]]},
  {"id": "en-billy-goats-gruff", "langue": "en", "emoji": "🐐", "palette": "ferme", "amb": "ferme", "titre": "The Three Billy Goats Gruff", "pages": [["Once upon a time, three billy goats named Gruff wanted to eat the sweet green grass across the river.", "🐐"], ["But under the bridge lived a grumpy troll. “Who’s that trip-trapping over my bridge?”", "🌉"], ["“Only me, the little Billy Goat Gruff. Please wait for my big brother, he’s much bigger!” So the troll let him pass.", "🌿"], ["The middle Billy Goat Gruff said the same thing. “Wait for my big brother!” And the troll let him pass too.", "🐾"], ["Then came the big Billy Goat Gruff. Trip, trap, trip, trap! “I’m the biggest of all!” he said.", "💪"], ["The troll looked at the big goat and got a fright. Splash! He jumped into the river and swam far away.", "💦"], ["The three Billy Goats Gruff crossed the bridge and ate the sweet grass on the hill.", "🌄"], ["They ate until they were round and happy, then fell asleep in the soft grass. Good night!", "🌙"]]},
  {"id": "en-chicken-little", "langue": "en", "emoji": "🐥", "palette": "ferme", "amb": "ferme", "titre": "Chicken Little", "pages": [["Once upon a time, Chicken Little was walking under an oak tree. Plop! An acorn fell on her head.", "🌰"], ["“Oh no! The sky is falling!” she cried. “I must tell the king!”", "🐥"], ["On the way, she met Henny Penny. “The sky is falling!” So Henny Penny came along.", "🐔"], ["Then they met Ducky Lucky and Goosey Loosey. “The sky is falling!” So they came along too.", "🦆"], ["Then they met Turkey Lurkey. And off they all went, running to see the king.", "🦃"], ["The wise old owl stopped them. “Show me where the sky fell,” he said. Chicken Little showed him the acorn.", "🦉"], ["Everyone laughed. “It was only an acorn!” The sky was still up high, blue and safe.", "🌈"], ["The friends walked home together, and the sky turned pink, then dark, full of stars. Good night!", "⭐"]]},
  {"id": "en-town-country-mouse", "langue": "en", "emoji": "🐭", "palette": "maison", "amb": "maison", "titre": "The Town Mouse and the Country Mouse", "pages": [["Once upon a time, a country mouse lived in a cozy hole under a tree in a quiet field.", "🐭"], ["One day, his cousin the town mouse came to visit. They ate seeds, corn and berries for dinner.", "🌽"], ["“This food is so plain,” said the town mouse. “Come to town with me! We eat cake and cheese.”", "🏢"], ["In town, they found a big table full of treats. “Yummy!” said the country mouse.", "🧀"], ["But then, a big dog barked! Woof! The two mice ran and hid behind a cupboard.", "🐕"], ["“Is it always this noisy here?” asked the country mouse. “Yes,” said his cousin. “Every day!”", "🔔"], ["“Thank you,” said the country mouse. “But I like my quiet home best.” And he went back to his field.", "🌾"], ["He ate his simple seeds and slept in peace under the moon. Good night!", "🌙"]]},
  {"id": "en-enormous-turnip", "langue": "en", "emoji": "🥕", "palette": "jardin", "amb": "jardin", "titre": "The Enormous Turnip", "pages": [["Once upon a time, an old man planted a turnip seed. “Grow, little turnip, grow sweet and strong!”", "🌱"], ["The turnip grew and grew. It grew enormous! The old man pulled and pulled, but it would not come up.", "🥕"], ["He called the old woman. She pulled the old man, and the old man pulled the turnip. But it would not come up.", "👵"], ["The old woman called the little girl. They pulled and pulled. But the turnip would not come up.", "👧"], ["The little girl called the dog. The dog called the cat. They pulled and pulled. Still it would not come up!", "🐶"], ["The cat called a tiny mouse. The mouse pulled the cat, and everybody pulled together.", "🐭"], ["Pop! Up came the enormous turnip, and everyone tumbled onto the soft grass, laughing.", "🎉"], ["They made a big pot of turnip soup and shared it together. Good night!", "🍲"]]},
  {"id": "en-elves-shoemaker", "langue": "en", "emoji": "👞", "palette": "luciole", "amb": "maison", "titre": "The Elves and the Shoemaker", "pages": [["Once upon a time, there was a kind shoemaker. He had only enough leather left for one pair of shoes.", "👞"], ["He cut the leather and left it on his table. Then he went to bed.", "🌙"], ["In the morning, a beautiful pair of shoes was waiting on the table! A lady bought them right away.", "✨"], ["Night after night, new shoes appeared. Who was making them? The shoemaker and his wife hid to see.", "🔦"], ["At midnight, two tiny elves came in. Tap, tap, tap! They made shoes very quickly, then ran away.", "🔨"], ["“The elves have no warm clothes,” said the wife. “Let’s make them some.”", "🧵"], ["They sewed tiny coats and knitted tiny socks, and left them on the table.", "🧦"], ["The elves put on their new clothes and danced with joy. Then they skipped off into the night.", "💃"], ["The shoemaker and his wife were happy forever after. Good night!", "⭐"]]},
  {"id": "en-princess-pea", "langue": "en", "emoji": "👑", "palette": "bonbon", "amb": "soir", "titre": "The Princess and the Pea", "pages": [["Once upon a time, a prince wanted to marry a real princess. But how could he find one?", "🤴"], ["One stormy night, someone knocked at the castle door. It was a girl, all wet from the rain.", "🌧"], ["“I am a princess,” she said. The queen smiled. “We shall see.”", "👑"], ["The queen put one tiny pea on the bed. Then she piled twenty soft mattresses on top of it.", "🟢"], ["The princess climbed up to the top and lay down to sleep.", "🛌"], ["In the morning, she yawned. “I hardly slept at all! Something small and hard was in my bed.”", "🥱"], ["“Only a real princess could feel a pea under twenty mattresses!” said the queen.", "🏰"], ["The prince and the princess were married, and the little pea was kept in a golden box. Good night!", "💛"]]},
  {"id": "en-cinderella", "langue": "en", "emoji": "👠", "palette": "galaxie", "amb": "soir", "titre": "Cinderella", "pages": [["Once upon a time, there was a kind girl called Cinderella. She worked hard all day for her stepmother and stepsisters.", "🧹"], ["One day, the king invited everyone to a grand ball. But Cinderella had no dress to wear.", "🏰"], ["Suddenly, her fairy godmother appeared. With a wave of her wand, a pumpkin became a shining coach!", "🎃"], ["Cinderella’s old dress became a beautiful gown, with two sparkling glass slippers. “Be home by midnight!”", "✨"], ["At the ball, Cinderella danced with the prince all evening. They were so happy.", "💃"], ["Ding, dong! The clock struck twelve. Cinderella ran home, and she lost one glass slipper on the steps.", "🕛"], ["The prince searched the whole kingdom. When the slipper fit Cinderella’s foot, everyone cheered.", "👠"], ["Cinderella forgave her stepsisters, and they all became friends.", "🤗"], ["She and the prince lived happily ever after. Good night!", "👑"]]},
  {"id": "en-fox-crow", "langue": "en", "emoji": "🐦", "palette": "foret", "amb": "foret", "titre": "The Fox and the Crow", "pages": [["Once upon a time, a crow found a piece of cheese. She flew up to a high branch to eat it.", "🐦"], ["A clever fox saw her. “Mmm, I would like that cheese,” he thought.", "🦊"], ["“Good morning, beautiful crow!” said the fox. “Your feathers shine like the night sky!”", "🌟"], ["“I’m sure your voice is the loveliest in the forest. Will you sing for me?”", "🎶"], ["The crow was so proud. She opened her beak to sing: “Caw! Caw!” And the cheese fell down.", "🧀"], ["The fox caught the cheese. “Thank you!” he said. “Next time, don’t believe every sweet word.”", "🌳"], ["The crow laughed. “You’re right. I’ll be wiser tomorrow.” And she found some sweet berries instead.", "🍒"], ["Then she tucked her head under her wing and went to sleep. Good night!", "🌙"]]},
  {"id": "en-ant-grasshopper", "langue": "en", "emoji": "🐜", "palette": "jardin", "amb": "jardin", "titre": "The Ant and the Grasshopper", "pages": [["Once upon a time, on a warm summer day, a grasshopper was singing and playing in the grass.", "🦗"], ["A little ant walked by, carrying a big seed. “Why are you working so hard?” asked the grasshopper.", "🐜"], ["“I’m saving food for winter,” said the ant. “You should too!” But the grasshopper just laughed and played.", "🌻"], ["Summer went by. Then autumn came, and the leaves fell from the trees.", "🍂"], ["Then came winter. The grasshopper was cold and hungry. He knocked at the ant’s door.", "⛄"], ["The kind ant let him in. “Come and share my food,” she said. “It’s warm in here.”", "🏠"], ["“Thank you,” said the grasshopper. “Next summer, I’ll help you work. And I’ll play music while we work!”", "🎻"], ["The two friends ate together and listened to the snow falling softly outside. Good night!", "🌙"]]},
  {"id": "en-wind-sun", "langue": "en", "emoji": "🌞", "palette": "arcenciel", "amb": "ciel", "titre": "The Wind and the Sun", "pages": [["Once upon a time, the Wind and the Sun had an argument. “I am stronger!” said the Wind. “No, I am!” said the Sun.", "🌞"], ["They saw a man walking along the road in a warm coat.", "🧥"], ["“Whoever can take off his coat is the strongest,” said the Sun. “Easy!” said the Wind.", "🚶"], ["The Wind blew and blew. Whoosh! But the man only held his coat more tightly.", "💨"], ["Then it was the Sun’s turn. The Sun came out from behind a cloud and shone softly and warmly.", "⛅"], ["The man felt so warm that he took off his coat and sat down under a tree.", "🌳"], ["“You win,” said the Wind. “Being gentle is stronger than being rough.”", "🍃"], ["Then the Sun went down to sleep, and the Wind whispered a soft lullaby. Good night!", "🌙"]]},
  {"id": "en-puss-in-boots", "langue": "en", "emoji": "🐱", "palette": "or", "amb": "soir", "titre": "Puss in Boots", "pages": [["Once upon a time, a miller’s youngest son had nothing but a cat. But this cat could talk!", "🐱"], ["“Give me a pair of boots and a bag,” said the cat, “and I will make you rich.”", "👢"], ["The clever cat caught rabbits and gave them to the king. “A gift from my master, the Marquis!” he said.", "🐇"], ["One day, the cat said, “Master, go swim in the river.” The king’s coach came by, and the cat called, “Help!”", "🌊"], ["The king gave the young man fine clothes and took him in his coach. The princess smiled at him.", "👑"], ["The cat ran ahead to a castle where a grumpy ogre lived. “Can you really change into a tiny mouse?” he asked.", "🏰"], ["The proud ogre turned into a mouse, and the mouse scampered away into the fields, never to come back.", "🐭"], ["The young man and the princess lived happily in the castle, and the cat wore his boots every day.", "💛"], ["Every night, Puss took off his boots and curled up by the fire. Good night!", "🌙"]]},
  {"id": "ar-hamama", "langue": "ar", "emoji": "🕊️", "palette": "galaxie", "amb": "foret", "titre": "الحمامة المطوّقة", "pages": [["كان يا ما كان، حمامة جميلة حول عنقها طوق ملوّن. كانت تعيش مع صديقاتها الحمامات في الغابة.", "🕊️"], ["في يوم من الأيام، رأت الحمامات حبوبًا كثيرة على الأرض. قالت الحمامات: هيّا نأكل!", "🌾"], ["نزلت الحمامات، فعلقت أرجلها في شبكة كبيرة. قالت الحمامة المطوّقة: لا تخفن، سنطير معًا.", "🕸️"], ["رفرفت الحمامات كلّها معًا: واحد، اثنان، ثلاثة! فطارت الشبكة معها إلى السماء.", "☁️"], ["طارت الحمامات إلى بيت صديقها الفأر الصغير، ونادته: يا صديقنا، نحتاج إلى مساعدتك!", "🐭"], ["خرج الفأر مسرعًا، وقرض خيوط الشبكة بأسنانه الصغيرة: قرض، قرض، قرض.", "✂️"], ["أراد الفأر أن يبدأ بالحمامة المطوّقة، فقالت: ابدأ بصديقاتي أوّلًا، وأنا بعدهنّ.", "❤️"], ["صارت الحمامات كلّها حرّة، فشكرن الفأر، وصرن أصدقاء إلى الأبد.", "🌳"], ["ونامت الحمامات في أعشاشها الدافئة تحت القمر. تصبح على خير!", "🌙"]]},
  {"id": "ar-asad-arnab", "langue": "ar", "emoji": "🦁", "palette": "or", "amb": "foret", "titre": "الأسد والأرنب", "pages": [["كان يا ما كان، أسد كبير يعيش في الغابة. كان يزأر كلّ يوم بصوت عالٍ: أنا الملك!", "🦁"], ["خافت الحيوانات من صوته، واختبأت في بيوتها. لم يعد أحد يلعب في الغابة.", "🌳"], ["قال الأرنب الصغير الذكيّ: عندي فكرة! سأذهب إلى الأسد وأتحدّث معه.", "🐇"], ["قال الأرنب: يا أيّها الأسد، هناك أسد آخر في البئر، ويقول إنّه هو الملك!", "💧"], ["تعجّب الأسد وقال: أرني إيّاه! فمشى الأرنب معه إلى البئر القديمة.", "🐾"], ["نظر الأسد في الماء، فرأى أسدًا يشبهه تمامًا. زأر الأسد، فزأر الأسد في الماء أيضًا!", "🦁"], ["ضحك الأرنب وقال: هذه صورتك يا أسد! إذا غضبت غضبت، وإذا ابتسمت ابتسمت.", "😊"], ["ابتسم الأسد، فابتسمت صورته. قال: من اليوم سأكون ملكًا لطيفًا، ولن أخيف أحدًا.", "👑"], ["خرجت الحيوانات تلعب من جديد، ونام الأسد هادئًا تحت النجوم. تصبح على خير!", "⭐"]]},
  {"id": "ar-sulahfat-battatan", "langue": "ar", "emoji": "🐢", "palette": "mer", "amb": "mer", "titre": "السلحفاة والبطّتان", "pages": [["كان يا ما كان، سلحفاة صغيرة تعيش في بحيرة، ومعها صديقتان: بطّتان بيضاوان.", "🐢"], ["في الصيف، قلّ الماء في البحيرة. قالت البطّتان: سنطير إلى بحيرة كبيرة فيها ماء كثير.", "☀️"], ["حزنت السلحفاة وقالت: وأنا؟ لا أستطيع أن أطير!", "🐢"], ["فكّرت البطّتان وقالتا: عندنا فكرة! امسكي هذا العود بفمك، ونحن نحمل طرفيه.", "🌿"], ["لكن انتبهي يا صديقتنا: لا تفتحي فمك أبدًا حتّى نصل.", "🤫"], ["طارت البطّتان عاليًا، والسلحفاة معهما. رأت الغيوم والحقول والبيوت الصغيرة.", "🦆"], ["رأى الأطفال السلحفاة الطائرة وصاحوا: انظروا! سلحفاة تطير! أرادت أن تجيب، لكنّها تذكّرت وسكتت.", "🧒"], ["وصلت الصديقات إلى البحيرة الكبيرة، ونزلن في الماء البارد بهدوء.", "🌊"], ["قالت السلحفاة: شكرًا يا صديقتيّ! السكوت في وقته ذكاء. تصبح على خير!", "🌙"]]},
  {"id": "ar-arnab-sulahfat", "langue": "ar", "emoji": "🐇", "palette": "jardin", "amb": "jardin", "titre": "الأرنب والسلحفاة", "pages": [["كان يا ما كان، أرنب سريع جدًّا، وسلحفاة بطيئة جدًّا.", "🐇"], ["ضحك الأرنب وقال: أنتِ بطيئة يا سلحفاة! قالت السلحفاة بهدوء: هيّا نتسابق إلى الشجرة الكبيرة.", "🐢"], ["بدأ السباق! جرى الأرنب بسرعة: قفز، قفز، قفز! ومشت السلحفاة خطوة بعد خطوة.", "👣"], ["نظر الأرنب خلفه، فلم يرَ السلحفاة. قال: عندي وقت كثير، سأنام قليلًا.", "🌳"], ["نام الأرنب تحت شجرة صغيرة، وحلم بجزرة كبيرة.", "🥕"], ["مشت السلحفاة ومشت، ولم تتوقّف أبدًا: خطوة، خطوة، خطوة.", "🐢"], ["استيقظ الأرنب، فرأى السلحفاة عند الشجرة الكبيرة! لقد وصلت أوّلًا.", "🏆"], ["ضحك الأرنب وقال: أحسنتِ يا سلحفاة! من يمشي بهدوء ولا يتوقّف يصل.", "🤝"], ["ونام الصديقان في الحديقة تحت القمر الجميل. تصبح على خير!", "🌙"]]},
  {"id": "ar-asad-far", "langue": "ar", "emoji": "🐭", "palette": "or", "amb": "foret", "titre": "الأسد والفأر", "pages": [["كان يا ما كان، أسد كبير نائم في الغابة تحت شجرة.", "🦁"], ["جاء فأر صغير يلعب، فمشى على أنف الأسد: تك، تك، تك!", "🐭"], ["استيقظ الأسد ووضع مخلبه على الفأر. قال الفأر: أرجوك اتركني يا أسد، وسأساعدك يومًا ما!", "🐾"], ["ضحك الأسد وقال: فأر صغير يساعدني أنا؟ ثمّ تركه يذهب بلطف.", "😄"], ["بعد أيّام، علق الأسد في شبكة كبيرة. حاول أن يخرج، لكنّه لم يستطع.", "🕸️"], ["سمع الفأر صوت الأسد، فجاء مسرعًا وقال: لا تقلق يا صديقي، أنا هنا!", "🐭"], ["قرض الفأر الحبال بأسنانه الصغيرة: قرض، قرض، قرض، حتّى خرج الأسد.", "✂️"], ["قال الأسد: شكرًا يا فأر! الصديق الصغير يمكن أن يكون عونًا كبيرًا.", "❤️"], ["ومن يومها صار الأسد والفأر صديقين، ينامان تحت النجوم. تصبح على خير!", "⭐"]]},
  {"id": "ar-ghurab-thalab", "langue": "ar", "emoji": "🦊", "palette": "foret", "amb": "foret", "titre": "الغراب والثعلب", "pages": [["كان يا ما كان، غراب أسود يقف على غصن شجرة، وفي منقاره قطعة جبن.", "🐦"], ["مرّ ثعلب ذكيّ، فرأى الجبن وقال في نفسه: أريد هذه القطعة!", "🦊"], ["قال الثعلب بصوت لطيف: صباح الخير يا غراب! ريشك جميل ولامع.", "✨"], ["وأنا متأكّد أنّ صوتك أجمل من ريشك. هل تغنّي لي أغنية؟", "🎵"], ["فرح الغراب كثيرًا، وفتح منقاره ليغنّي: قاق، قاق! فسقط الجبن على الأرض.", "🧀"], ["أخذ الثعلب الجبن وقال: يا غراب، لا تصدّق كلّ من يمدحك.", "🦊"], ["فكّر الغراب قليلًا، ثمّ ابتسم وقال: شكرًا على الدرس! سأكون أذكى في المرّة القادمة.", "🐦"], ["ثمّ وجد الغراب حبّات عنب لذيذة، وأكلها في عشّه بهدوء.", "🍇"], ["ونام الغراب في عشّه تحت القمر. تصبح على خير!", "🌙"]]},
  {"id": "ar-namla-hamama", "langue": "ar", "emoji": "🐜", "palette": "jardin", "amb": "jardin", "titre": "النملة والحمامة", "pages": [["كان يا ما كان، نملة صغيرة عطشانة، ذهبت تشرب من النهر.", "🐜"], ["هبّت ريح خفيفة، فوقعت النملة في الماء. صاحت: النجدة! النجدة!", "💧"], ["رأتها حمامة بيضاء على شجرة، فأخذت ورقة خضراء ورمتها في الماء قرب النملة.", "🕊️"], ["صعدت النملة على الورقة، وطفت بها حتّى وصلت إلى الشاطئ. قالت: شكرًا يا حمامة!", "🍃"], ["بعد أيّام، جاء صيّاد يريد أن يمسك الحمامة بشبكته.", "🕸️"], ["رأت النملة الصيّاد، فقرصت قدمه قرصة صغيرة. قال: آه! وقفز من مكانه.", "🐜"], ["سمعت الحمامة الصوت، فطارت بعيدًا إلى السماء الزرقاء.", "☁️"], ["قالت الحمامة: شكرًا يا نملة! ساعدتكِ فساعدتِني. الخير يعود لصاحبه.", "❤️"], ["ونامت الحمامة في عشّها، ونامت النملة في بيتها الصغير. تصبح على خير!", "🌙"]]},
  {"id": "ar-juha-qamar", "langue": "ar", "emoji": "🌕", "palette": "galaxie", "amb": "soir", "titre": "جحا والقمر في البئر", "pages": [["كان يا ما كان، في ليلة جميلة، خرج جحا يشرب ماءً من البئر.", "👴"], ["نظر جحا في البئر، فرأى القمر في الماء! قال: يا للمسكين! القمر سقط في البئر!", "🌕"], ["قال جحا: لا تخف يا قمر، سأخرجك! وأحضر حبلًا طويلًا.", "🧵"], ["رمى جحا الحبل في البئر، وشدّ وشدّ، فعلق الحبل بحجر كبير.", "💧"], ["شدّ جحا بقوّة: هيّا! هيّا! فانفلت الحبل، ووقع جحا على ظهره فوق العشب الناعم.", "🌿"], ["فتح جحا عينيه، فرأى القمر في السماء عاليًا، يلمع ويبتسم.", "✨"], ["فرح جحا وقال: الحمد لله! تعبت قليلًا، لكنّي أعدت القمر إلى السماء!", "😄"], ["ضحكت النجوم، وضحك القمر. واستلقى جحا ينظر إلى السماء.", "⭐"], ["ثمّ نام جحا فوق العشب، والقمر يحرسه بنوره. تصبح على خير!", "🌙"]]},
  {"id": "ar-juha-kum", "langue": "ar", "emoji": "🧥", "palette": "maison", "amb": "maison", "titre": "كُلْ يا كُمّي", "pages": [["كان يا ما كان، دُعي جحا إلى وليمة كبيرة في بيت جاره.", "👴"], ["لبس جحا ثيابه القديمة البسيطة، وذهب إلى الوليمة مبتسمًا.", "👕"], ["لكنّ الناس لم ينتبهوا إليه، ولم يقل له أحد: تفضّل يا جحا.", "🏠"], ["رجع جحا إلى بيته، ولبس معطفًا جديدًا جميلًا له أكمام طويلة.", "🧥"], ["عاد جحا إلى الوليمة، فقام الناس وقالوا: أهلًا وسهلًا! تفضّل يا ضيفنا!", "🍽️"], ["جلس جحا أمام الطعام، ووضع كُمّ معطفه قرب الصحن وقال: كُلْ يا كُمّي، كُلْ!", "🥘"], ["تعجّب الناس وسألوه: ماذا تفعل يا جحا؟", "❓"], ["قال جحا: أنتم أكرمتم المعطف لا أنا! فالمعطف يستحقّ أن يأكل.", "🧥"], ["فهم الناس الدرس وقالوا: نكرم الناس لقلوبهم لا لثيابهم. وضحك الجميع. تصبح على خير!", "❤️"]]},
  {"id": "ar-aladdin", "langue": "ar", "emoji": "🪔", "palette": "or", "amb": "soir", "titre": "علاء الدين والمصباح", "pages": [["كان يا ما كان، في مدينة بعيدة، ولد طيّب اسمه علاء الدين، يعيش مع أمّه في بيت صغير.", "🏠"], ["في يوم من الأيّام، وجد علاء الدين في مغارة قديمة مصباحًا صغيرًا عليه غبار.", "🪔"], ["مسح علاء الدين المصباح بكمّه، فخرج منه دخان أزرق، ثمّ ظهر جنّيّ كبير ضاحك!", "🧞"], ["قال الجنّيّ: شكرًا لأنّك أخرجتني! أنا صديقك الآن. ماذا تتمنّى؟", "✨"], ["فكّر علاء الدين وقال: أتمنّى طعامًا لذيذًا لي ولأمّي ولجيراننا.", "🍞"], ["صفّق الجنّيّ، فامتلأت المائدة بالخبز والتمر والحليب. فرح الجميع وأكلوا معًا.", "🌴"], ["ثمّ قال علاء الدين: وأمنيتي الأخيرة لك يا جنّيّ: أن تكون حرًّا!", "🕊️"], ["طار الجنّيّ فرحًا بين النجوم وقال: أنت أطيب صديق يا علاء الدين!", "⭐"], ["ونام علاء الدين وأمّه في بيتهما الدافئ سعيدين. تصبح على خير!", "🌙"]]},
  {"id": "ar-sindbad", "langue": "ar", "emoji": "⛵", "palette": "mer", "amb": "mer", "titre": "السندباد والطائر الكبير", "pages": [["كان يا ما كان، بحّار شجاع اسمه السندباد، يحبّ السفر في البحر.", "⛵"], ["في يوم من الأيّام، وصلت سفينته إلى جزيرة جميلة فيها نخل كثير.", "🌴"], ["مشى السندباد في الجزيرة، فرأى بيضة كبيرة جدًّا، بيضاء ولامعة مثل القبّة.", "🥚"], ["ثمّ سمع صوت أجنحة: فررر! جاء طائر ضخم اسمه الرُّخّ، وجلس بجانب البيضة.", "🦅"], ["قال السندباد بلطف: مرحبًا يا طائر الرّخّ! أنا بعيد عن بيتي، هل تساعدني؟", "😊"], ["أنزل الطائر جناحه، فصعد السندباد على ظهره، وطارا فوق البحر الأزرق.", "🌊"], ["رأى السندباد من فوق الدلافين تقفز، والسفن الصغيرة تسير.", "🐬"], ["أنزله الطائر قرب بيته، فقال السندباد: شكرًا يا صديقي الكبير!", "🏠"], ["وحكى السندباد لأهله عن رحلته، ثمّ نام يحلم بالبحر. تصبح على خير!", "🌙"]]},
  {"id": "ar-namla-jundub", "langue": "ar", "emoji": "🦗", "palette": "ferme", "amb": "ferme", "titre": "النملة والجندب", "pages": [["كان يا ما كان، في الصيف الحارّ، نملة صغيرة تعمل كلّ يوم وتجمع الحبوب.", "🐜"], ["وكان جندب أخضر يغنّي ويعزف طول النهار تحت الشمس.", "🦗"], ["قال الجندب: تعالي نلعب يا نملة! قالت النملة: أجمع طعامي للشتاء، فالشتاء قادم.", "🌾"], ["ضحك الجندب وقال: الشتاء بعيد! وواصل الغناء والرقص.", "🎵"], ["جاء الشتاء، وتساقط الثلج الأبيض، ولم يجد الجندب طعامًا.", "❄️"], ["طرق الجندب باب النملة وقال: أنا جائع وبردان، هل تساعدينني؟", "🚪"], ["فتحت النملة الباب وقالت: تفضّل يا جندب! عندي طعام يكفينا معًا.", "🏠"], ["أكل الجندب وقال: شكرًا يا نملة! في الصيف القادم سأعمل معك، وأغنّي لك أيضًا.", "❤️"], ["وفي ليالي الشتاء، كان الجندب يغنّي بهدوء، والنملة تنام. تصبح على خير!", "🌙"]]},
  {"id": "ar-thalab-inab", "langue": "ar", "emoji": "🍇", "palette": "arcenciel", "amb": "jardin", "titre": "الثعلب والعنب", "pages": [["كان يا ما كان، ثعلب صغير يمشي في البستان في يوم مشمس.", "🦊"], ["رأى عنقودًا من العنب الأرجوانيّ، معلّقًا عاليًا على الكرمة.", "🍇"], ["قال الثعلب: يا سلام! عنب لذيذ! وقفز ليأخذه، لكنّه لم يصل.", "🦊"], ["قفز مرّة ثانية، ومرّة ثالثة، لكنّ العنب كان عاليًا جدًّا.", "☀️"], ["جلس الثعلب وقال: ربّما العنب حامض، لا أريده! ثمّ سكت وفكّر.", "🤔"], ["قال في نفسه: لا، العنب ليس حامضًا. أنا فقط لم أجد الطريقة بعد.", "💡"], ["رأى الثعلب صندوقًا خشبيًّا، فدفعه تحت الكرمة، ووقف عليه، فوصل إلى العنب!", "📦"], ["أكل الثعلب حبّة حلوة، وأعطى جاره القنفذ حبّات أيضًا. قال: الحمد لله!", "🦔"], ["ونام الثعلب في جحره شبعان مبتسمًا. تصبح على خير!", "🌙"]]},

  {"id": "ar-thalab-laqlaq", "langue": "ar", "emoji": "🏺", "palette": "foret", "amb": "foret", "titre": "الثعلب واللقلق", "pages": [["كان يا ما كان، ثعلب ولقلق جاران في الغابة.", "🦊"], ["قال الثعلب: تعالَ يا لقلق، تعشَّ عندي الليلة!", "🏠"], ["وضع الثعلب الحساء في صحن مسطّح. لحس الثعلب الحساء بسهولة، لكنّ اللقلق بمنقاره الطويل لم يستطع!", "🍲"], ["رجع اللقلق إلى بيته جائعًا، وقال: غدًا أدعو الثعلب.", "🐦"], ["في الغد، وضع اللقلق الطعام في جرّة طويلة وضيّقة.", "🏺"], ["أدخل اللقلق منقاره الطويل وأكل. أمّا الثعلب فلم يصل أنفه إلى الطعام!", "🦊"], ["فهم الثعلب وقال: آسف يا لقلق! لم أفكّر فيك.", "😔"], ["ابتسم اللقلق، وأحضر صحنًا للثعلب وجرّة لنفسه، وأكلا معًا فرحين.", "🍽️"], ["ومن يومها يفكّر كلّ صديق في صديقه. تصبح على خير!", "🌙"]]},
  {"id": "ar-ghurab-jarra", "langue": "ar", "emoji": "🐦", "palette": "or", "amb": "ciel", "titre": "الغراب والجرّة", "pages": [["كان يا ما كان، في يوم حارّ جدًّا، غراب صغير عطشان يطير ويبحث عن ماء.", "🐦"], ["رأى الغراب جرّة في حديقة. قال: ماء! ماء!", "🏺"], ["أدخل منقاره في الجرّة، لكنّ الماء كان قليلًا في الأسفل، ولم يصل إليه.", "💧"], ["لم يبكِ الغراب ولم يغضب. جلس وفكّر: كيف أشرب؟", "🤔"], ["رأى حصى صغيرة على الأرض، فقال: عندي فكرة!", "💡"], ["أخذ حصاة ووضعها في الجرّة، ثمّ حصاة أخرى، ثمّ أخرى: واحدة، اثنتان، ثلاث.", "🐦"], ["ارتفع الماء شيئًا فشيئًا، حتّى صار قريبًا من فم الجرّة.", "🏺"], ["شرب الغراب حتّى ارتوى وقال: التفكير الهادئ يحلّ المشكلة!", "😊"], ["وطار الغراب إلى عشّه ونام سعيدًا. تصبح على خير!", "🌙"]]},
  {"id": "ar-faran", "langue": "ar", "emoji": "🐭", "palette": "ferme", "amb": "ferme", "titre": "فأر الريف وفأر المدينة", "pages": [["كان يا ما كان، فأر صغير يعيش في الريف، في بيت بسيط تحت شجرة.", "🐭"], ["زاره ابن عمّه فأر المدينة، فقدّم له حبوبًا وجزرًا وقمحًا.", "🥕"], ["قال فأر المدينة: طعامك بسيط! تعال معي إلى المدينة، عندنا جبن وحلوى.", "🧀"], ["ذهب الفأران إلى المدينة، إلى بيت كبير فيه مائدة مليئة بالحلوى.", "🍰"], ["بدأ الفأران يأكلان، فجاءت قطّة كبيرة تقول: مياو!", "🐈"], ["اختبأ الفأران بسرعة في جحر صغير، ولم ترهما القطّة. فذهبت تنام.", "🐭"], ["قال فأر الريف: شكرًا يا ابن عمّي، لكنّي أحبّ بيتي الهادئ.", "🏡"], ["رجع فأر الريف إلى بيته، وأكل حبّة قمح وهو سعيد.", "🌾"], ["ونام في سريره الصغير، والنجوم تلمع فوق الحقول. تصبح على خير!", "⭐"]]},
  {"id": "tn-jha-mesmar", "langue": "tn", "emoji": "🔨", "palette": "maison", "amb": "maison", "titre": "مسمار جحا", "pages": [["نهار من النهارات، جحا حبّ يبيع دارو الصغيرة.", "🏠"], ["جا راجل وقال لو: نشريها! جحا قال: نبيعهالك، أمّا المسمار اللي في الحيط يقعد متاعي.", "🧔"], ["الراجل ضحك وقال: باهي، مسمار صغيّر، ماهوش مشكل!", "👳"], ["الغدوة، جحا دقّ الباب: جيت نشوف مسماري! وعلّق فيه جبّتو.", "🔨"], ["ومن بعد جا وعلّق فيه قفّة تمر. وولّى يجي يسلّم على مسمارو كل صباح!", "🧺"], ["الراجل قال: يا جحا، كل نهار عندي؟ جحا تبسّم: شنوّة نعمل، مسماري يستنّاني!", "😄"], ["في الآخر الراجل ضحك برشا وقال: تعال اقعد معانا، نشربو تاي مع بعضنا.", "☕"], ["وولّاو صحاب، والمسمار في الحيط يسمع ضحكهم كل عشيّة. تصبح على خير!", "🌙"]]},
  {"id": "tn-jha-qadhi", "langue": "tn", "emoji": "🧔", "palette": "or", "amb": "soir", "titre": "جحا والقاضي وريحة الماكلة", "pages": [["كان يا مكان، راجل مسكين ما عندو كان خبزة يابسة.", "🍞"], ["تعدّى قدّام حانوت طبّاخ، وريحة الكسكسي تشهّي برشا.", "🍲"], ["حطّ خبزتو فوق البخار وكلاها بالريحة، وقال: الحمد لله!", "😊"], ["الطبّاخ خرج وقال: خلّصني! كليت ريحة ماكلتي!", "🥄"], ["مشاو الزوز لجحا، اللي كان القاضي متاع الحومة.", "🧔"], ["جحا خرّج صرّة فيها فلوس، وحرّكها قدّام ودن الطبّاخ: شخشخ، شخشخ!", "💰"], ["قال: سمعت الصوت؟ هاك خلّصتك! الريحة تتخلّص بالصوت!", "👂"], ["الطبّاخ ضحك، وعزم الراجل المسكين على صحن كسكسي سخون.", "🥣"], ["وكلاو مع بعضهم فرحانين. نوم الهناء يا حبيبي!", "🌙"]]},
  {"id": "tn-jha-souk", "langue": "tn", "emoji": "🫏", "palette": "or", "amb": "ferme", "titre": "جحا يبيع الحمار", "pages": [["نهار من النهارات، جحا قال: باش نبيع حماري في السوق.", "🫏"], ["مشى للسوق، والسوق فيه برشا ناس وبرشا حاجات.", "🏪"], ["الدلّال شدّ الحمار وبدا يعيّط: شكون يشري أحلى حمار في الدنيا؟", "📣"], ["حمار قوي، يخدم برشا، ودنيه طوال، وقلبو طيّب!", "🫏"], ["جحا سمع وقال في قلبو: يا سلام! حماري هكّاكة؟ ما كنتش نعرف!", "🤔"], ["جحا رفع يدّو وعيّط: أنا نشريه! أنا نشريه!", "✋"], ["الناس الكل ضحكو، والدلّال قال: يا جحا، راهو حمارك!", "😂"], ["جحا قال: عندك الحق، ما نبيعش صاحبي الطيّب! ورجع للدار راكب عليه فرحان.", "🏠"], ["والحمار رقد في الزريبة، وجحا رقد في فراشو. تصبح على خير!", "🌙"]]},
  {"id": "tn-jha-dik", "langue": "tn", "emoji": "🐓", "palette": "ferme", "amb": "ferme", "titre": "جحا والديك", "pages": [["نهار من النهارات، جحا مشى للحمّام مع صحابو.", "🛁"], ["صحابو خبّاو كل واحد عظمة في جيبو، وقالو: نلعبو لعبة!", "🥚"], ["قالو: اللي ما يجيبش عظمة كيف الدجاجة، يخلّص الحمّام على الكل!", "🐔"], ["وبداو الواحد بعد الآخر: قاق قاق! ويخرّجو العظمة.", "🥚"], ["جحا ما عندوش عظمة، تبسّم وعيّط: كوكوريكووو!", "🐓"], ["صحابو تعجّبو: شنوّة تعمل يا جحا؟", "😮"], ["قال: الدجاجات الكل يلزمهم ديك، وإلا شكون يفيّقكم الصباح؟", "🌅"], ["الكل ضحكو برشا، وخلّصو الحمّام مع بعضهم وروّحو فرحانين.", "😄"], ["والديك سكت في الليل باش الكل يرقدو. تصبح على خير!", "🌙"]]},

// Devine : Lumi dessine, l'enfant choisit l'image.       (vocabulaire, reconnaissance des formes)
// Écoute et trouve : Lumi dit un mot, l'enfant le trouve. (compréhension orale)

// L'intrus : trouver celui qui n'est pas de la famille.  (catégories, raisonnement)
let jeuEnCours = false, jeuType = 'devine', bonne = null, aTrouver = 0, dernierTheme = null;
const THEMES_MOTS = Object.entries(NOEUDS).filter(([, n]) => n.mots && n.un);
const PARENT = {};
Object.entries(NOEUDS).forEach(([id, n]) => (n.enfants || []).forEach((e) => { PARENT[e] = id; }));
const entrees = (mots) => mots.split(' ').map((e) => PAR_EMOJI.get(e)).filter(Boolean);
const TOUS = [...new Set(THEMES_MOTS.flatMap(([, n]) => entrees(n.mots)))];
const hasard = (liste) => liste[(Math.random() * liste.length) | 0];

    bonne = lieu; aTrouver = bons.length;

    avatar?.forme(lieu.emoji);
    carte(lieu.emoji, L.touche(lieu.dans[langue]), '', false);
    boutonsChoix(melanger([...bons, ...ailleurs]), (m, b) => ranger(m, b, bons));

  } else if (jeuType === 'intrus') {
    const [idA, themeA] = hasard(THEMES_MOTS.filter(([id]) => id !== dernierTheme));

    parler(L.intrus);
  }
}

function toucherBulle(m, b) {

async function gagne(texte, j) {
  $('score').textContent = '⭐ ' + Progres.etoiles;

function repondre(m, b) {
  const L = LANGUES[langue];
  if (m !== bonne) { secouer(b); son('faux'); parler(L.encore); return; }

  const j = ++jeton;
  b.classList.add('juste'); Progres.gagner(bonne);
  avatar?.forme(bonne.emoji);
  const phrase = jeuType === 'intrus' ? majuscule(L.pasUn(nomComplet(bonne), bonne.un[langue])) : nomComplet(bonne);
  carteMot(bonne, jeuType === 'intrus' ? phrase : L.bravo);
  gagne(`${L.bravo} ${phrase}`, j);

function ranger(m, b, bons) {
  const L = LANGUES[langue];
  if (b.classList.contains('juste')) return;
  if (!bons.includes(m)) {
    secouer(b); son('faux');
    const chez = LIEUX.find((l) => l.mots.includes(m.emoji));

  b.classList.add('juste'); b.disabled = true;

// ---------- Micro : reconnaissance vocale du navigateur ----------
const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
let reco = null;
function microIndisponible() {
  $('legende').textContent = LANGUES[langue].microKo;
  $('saisie').focus();
}
// Dans l'app : reconnaissance vocale native (Safari/Chrome dans une app n'en ont pas)
async function microNatif() {
  const R = PLUGINS.SpeechRecognition, b = $('btn-micro');
  if (b.classList.contains('ecoute')) { try { await R.stop(); } catch {} return; }
  try {
    const perm = await R.requestPermissions?.();
    if (perm && perm.speechRecognition && perm.speechRecognition !== 'granted') return microIndisponible();
    b.classList.add('ecoute'); $('legende').textContent = LANGUES[langue].ecoute; avatar?.mode('ecoute'); avatar?.forme(null);
    const { matches = [] } = await R.start({ language: LANGUES[langue].voix, maxResults: 3, partialResults: false, popup: false });
    const bon = matches.find((a) => chercher(a)) || matches[0];
    if (bon) { $('legende').textContent = bon; montrer(bon); }
  } catch { microIndisponible(); }
  b.classList.remove('ecoute');
}
$('btn-micro').onclick = () => {
  diapo++;
  if (PLUGINS.SpeechRecognition) return microNatif();
  if (reco) { reco.stop(); return; }
  if (!Reco) return microIndisponible();
  try {
    reco = new Reco();
    reco.lang = LANGUES[langue].voix; reco.interimResults = true; reco.maxAlternatives = 3;
    reco.onstart = () => { $('btn-micro').classList.add('ecoute'); $('legende').textContent = LANGUES[langue].ecoute; avatar?.mode('ecoute'); avatar?.forme(null); };
    let alts = [], fait = false, silence;
    // parmi les propositions, on prend la première qu'on sait dessiner
    const conclure = () => { if (fait || !alts.length) return; fait = true; clearTimeout(silence); montrer(alts.find((a) => chercher(a)) || alts[0]); };
    reco.onresult = (e) => {
      const r = e.results[e.results.length - 1];
      alts = [...r].map((a) => a.transcript).filter((a) => a.trim());
      $('legende').textContent = r[0].transcript;
      if (r.isFinal) { conclure(); reco?.stop(); return; }
      // iOS n'envoie pas toujours de résultat « final » : après un court silence, on s'arrête
      clearTimeout(silence);
      silence = setTimeout(() => { conclure(); reco?.stop(); }, 1300);
    };
    reco.onerror = (e) => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') microIndisponible(); };
    reco.onend = () => { conclure(); reco = null; $('btn-micro').classList.remove('ecoute'); if ($('legende').textContent === LANGUES[langue].ecoute) $('legende').textContent = LANGUES[langue].micro; };
    reco.start();
  } catch { reco = null; microIndisponible(); }
};

const tf = (k) => TXT_FA[k][langue] ?? TXT_FA[k].fr;

// ----- Achat unique (App Store / Google Play via RevenueCat) -----
const Achat = (() => {
  const P = PLUGINS.Purchases;
  let ouvert = !NATIF && CONFIG_APP.webToutOuvert, paquet = null, pret = false;
  try { if (localStorage.getItem('lumi-complet') === 'oui') ouvert = true; } catch {}
  const noter = (info) => {
    const oui = !!info?.entitlements?.active?.[CONFIG_APP.droit];
    if (NATIF) { ouvert = oui; try { localStorage.setItem('lumi-complet', oui ? 'oui' : 'non'); } catch {} }
    rafraichirVerrous();
  };
  async function init(idCompte) {
    const cle = CONFIG_APP.revenuecat[PLATEFORME];
    if (!P || !cle) return;
    try {
      if (!pret) { await P.configure({ apiKey: cle, appUserID: idCompte || undefined }); pret = true; }
      else if (idCompte) await P.logIn({ appUserID: idCompte });
      noter((await P.getCustomerInfo()).customerInfo);
      const off = await P.getOfferings();
      paquet = off?.current?.availablePackages?.[0] || null;
    } catch (e) { console.warn('Achats', e); }
  }
  return {
    init, get ouvert() { return ouvert; }, get dispo() { return !!(P && pret && paquet); },
    get prix() { return paquet?.product?.priceString || ''; },
    async acheter() { const r = await P.purchasePackage({ aPackage: paquet }); noter(r.customerInfo); return ouvert; },
    async restaurer() { const r = await P.restorePurchases(); noter(r.customerInfo); return ouvert; },
  };
})();
const libre = (id) => Achat.ouvert || GRATUIT.has(id);
function rafraichirVerrous() {
  if (typeof afficher === 'function' && pile.length) afficher();
}

// ----- Porte parents : une consigne écrite en lettres, qu'un petit ne sait pas lire -----
function porteParents(ensuite) {
  const suite = Array.from({ length: 3 }, () => 1 + ((Math.random() * 9) | 0));
  let tape = [];
  const f = fenetre('porte');
  f.innerHTML = `<button class="fa-fermer" aria-label="${tf('fermer')}">✕</button><h2>🔒 ${tf('parents')}</h2>
    <p class="fa-consigne"></p><div class="fa-saisie"></div><div class="fa-pave"></div>`;
  f.querySelector('.fa-consigne').textContent = `${tf('porte')} ${suite.map((n) => TXT_FA.chiffres[langue][n]).join(', ')}`;
  const pave = f.querySelector('.fa-pave');
  for (let n = 1; n <= 9; n++) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = n;
    b.onclick = () => {
      tape.push(n); f.querySelector('.fa-saisie').textContent = '● '.repeat(tape.length);
      if (tape.length < 3) return;
      if (tape.join() === suite.join()) { fermerFenetre(); ensuite(); } else { tape = []; f.querySelector('.fa-saisie').textContent = ''; trembler(pave); }
    };
    pave.appendChild(b);
  }
  f.querySelector('.fa-fermer').onclick = fermerFenetre;
}
function trembler(el) { el.animate([{ transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'none' }], { duration: 300 }); }
function fenetre(type) {
  fermerFenetre();
  const fond = document.createElement('div');
  fond.className = 'fa-fond'; fond.id = 'fa-fond'; fond.dir = LANGUES[langue].dir;
  fond.innerHTML = `<div class="fa-fenetre fa-t-${type}" role="dialog" aria-modal="true"></div>`;
  fond.onclick = (e) => { if (e.target === fond) fermerFenetre(); };
  document.body.appendChild(fond);
  return fond.firstChild;
}
function fermerFenetre() { $('fa-fond')?.remove(); }

// Un enfant touche un contenu fermé : Lumi l'explique, un parent peut ouvrir
function proposerAchat() {
  son('faux');
  const f = fenetre('verrou');
  f.innerHTML = `<div class="fa-cadenas">🔒✨</div><p class="fa-grand"></p><button class="fa-bouton fa-principal">👨‍👩‍👧 ${tf('parents')}</button><button class="fa-lien">${tf('fermer')}</button>`;
  f.querySelector('.fa-grand').textContent = tf('verrou');
  f.querySelector('.fa-principal').onclick = () => porteParents(() => espaceParents('achat'));
  f.querySelector('.fa-lien').onclick = fermerFenetre;
  parler(tf('verrou'));
}

// ----- Choisir l'enfant qui joue -----
function choisirEnfant() {
  const f = fenetre('enfants');
  f.innerHTML = `<h2></h2><div class="fa-enfants"></div>`;
  f.querySelector('h2').textContent = tf('qui');
  Profils.liste.forEach((p) => {

    f.querySelector('.fa-enfants').appendChild(b);
  });

// ----- Espace parents : enfants, achat, compte -----
function espaceParents(section) {
  const f = fenetre('parents');
  f.innerHTML = `<button class="fa-fermer" aria-label="${tf('fermer')}">✕</button><h2>👨‍👩‍👧 ${tf('parents')}</h2>
    <section class="fa-bloc" id="fa-achat"></section><section class="fa-bloc" id="fa-enfants"></section>
    <section class="fa-bloc" id="fa-compte"></section><p class="fa-pied"><a target="_blank" rel="noopener"></a></p>`;
  f.querySelector('.fa-fermer').onclick = () => { fermerFenetre(); construireAccueil?.(); };
  f.querySelector('.fa-pied a').href = CONFIG_APP.confidentialite; f.querySelector('.fa-pied a').textContent = tf('confidentialite');
  blocAchat(); blocEnfants(); blocCompte();
  if (section) f.querySelector('#fa-' + section)?.scrollIntoView({ block: 'start' });
}
function blocAchat() {
  const b = $('fa-achat'); if (!b) return;
  b.innerHTML = `<h3>✨ ${tf('complet')}</h3><p></p><div class="fa-actions"></div><p class="fa-msg"></p>`;
  b.querySelector('p').textContent = tf('completTxt');
  const act = b.querySelector('.fa-actions'), msg = b.querySelector('.fa-msg');
  if (Achat.ouvert) { msg.textContent = tf('debloque'); return; }
  if (!NATIF) { msg.textContent = tf('webAchat'); return; }
  const acheter = document.createElement('button'); acheter.className = 'fa-bouton fa-principal';
  acheter.textContent = `${tf('acheter')}${Achat.prix ? ' · ' + Achat.prix : ''}`; acheter.disabled = !Achat.dispo;
  const rest = document.createElement('button'); rest.className = 'fa-bouton'; rest.textContent = tf('restaurer');
  const faire = async (fn) => { try { msg.textContent = '…'; const ok = await fn(); msg.textContent = ok ? tf('debloque') : ''; if (ok) { fete(); blocAchat(); } } catch (e) { msg.textContent = e?.userCancelled || /cancel/i.test(e?.message || '') ? '' : tf('erreur'); } };
  acheter.onclick = () => faire(Achat.acheter); rest.onclick = () => faire(Achat.restaurer);
  act.append(acheter, rest);
}
function blocEnfants() {
  const b = $('fa-enfants'); if (!b) return;
  b.innerHTML = `<h3>🧒 ${tf('enfants')}</h3><div class="fa-liste"></div>`;
  Profils.liste.forEach((p) => {
    const l = document.createElement('div'); l.className = 'fa-ligne';
    l.innerHTML = `<button class="fa-avatar"></button><input maxlength="20"><button class="fa-suppr" aria-label="${tf('supprimer')}">🗑️</button>`;
    l.querySelector('.fa-avatar').textContent = p.avatar;
    l.querySelector('.fa-avatar').onclick = () => { const a = AVATARS[(AVATARS.indexOf(p.avatar) + 1) % AVATARS.length]; Profils.modifier(p.id, { avatar: a }); blocEnfants(); };
    const champ = l.querySelector('input'); champ.value = p.nom; champ.placeholder = tf('prenom');
    champ.onchange = () => Profils.modifier(p.id, { nom: champ.value.trim() });
    const suppr = l.querySelector('.fa-suppr'); suppr.hidden = Profils.liste.length < 2;
    suppr.onclick = () => { if (confirm(`${tf('supprimer')} ${p.nom || p.avatar} ?`)) { Profils.supprimer(p.id); blocEnfants(); } };
    b.querySelector('.fa-liste').appendChild(l);
  });
  const plus = document.createElement('button'); plus.className = 'fa-bouton'; plus.textContent = tf('ajouter');
  plus.onclick = () => { Profils.ajouter('', AVATARS[Profils.liste.length % AVATARS.length]); blocEnfants(); $('fa-enfants').querySelector('.fa-ligne:last-child input')?.focus(); };
  b.appendChild(plus);
}
function blocCompte() {
  const b = $('fa-compte'); if (!b) return;
  b.innerHTML = `<h3>☁️ ${tf('compte')}</h3><p></p><div class="fa-form"></div><p class="fa-msg"></p>`;
  b.querySelector('p').textContent = tf('compteTxt');
  const form = b.querySelector('.fa-form'), msg = b.querySelector('.fa-msg');
  if (!Famille.dispo) { msg.textContent = tf('bientot'); return; }
  if (Famille.email) {
    form.innerHTML = `<p class="fa-qui"></p><button class="fa-bouton" data-a="sortir"></button><button class="fa-lien fa-danger" data-a="suppr"></button>`;
    form.querySelector('.fa-qui').textContent = `${tf('connecte')} ${Famille.email}`;
    form.querySelector('[data-a=sortir]').textContent = tf('deconnecter');
    form.querySelector('[data-a=suppr]').textContent = tf('supprimerCompte');
    form.querySelector('[data-a=sortir]').onclick = () => { Famille.sortir(); blocCompte(); };
    form.querySelector('[data-a=suppr]').onclick = async () => { if (!confirm(tf('sur'))) return; try { await Famille.supprimer(); blocCompte(); } catch { msg.textContent = tf('erreur'); } };
    msg.textContent = Famille.derniereSynchro ? tf('synchro') : '';
    return;
  }
  form.innerHTML = `<input type="email" autocomplete="email" inputmode="email"><button class="fa-bouton fa-principal" data-a="code"></button>
    <input class="fa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" hidden><button class="fa-bouton" data-a="ok" hidden></button>`;
  const [mail, , code] = form.querySelectorAll('input, button');
  mail.placeholder = tf('email'); form.querySelector('.fa-code').placeholder = tf('code');
  form.querySelector('[data-a=code]').textContent = tf('envoyerCode'); form.querySelector('[data-a=ok]').textContent = tf('valider');
  form.querySelector('[data-a=code]').onclick = async () => {
    try { msg.textContent = '…'; await Famille.envoyerCode(mail.value.trim()); msg.textContent = '📩'; form.querySelector('.fa-code').hidden = false; form.querySelector('[data-a=ok]').hidden = false; form.querySelector('.fa-code').focus(); }
    catch { msg.textContent = tf('erreur'); }
  };
  form.querySelector('[data-a=ok]').onclick = async () => {
    try { msg.textContent = '…'; await Famille.verifier(mail.value.trim(), form.querySelector('.fa-code').value.trim()); blocCompte(); blocEnfants(); }
    catch { msg.textContent = tf('erreur'); }
  };
}

// ----- Compte parent (Supabase, sans bibliothèque) : profils + progression sauvegardés -----
Famille = (() => {
  const { url, cle } = CONFIG_APP.supabase, dispo = !!(url && cle);
  let s = null, minuteur = null, derniere = 0;
  try { s = JSON.parse(localStorage.getItem('lumi-compte') || 'null'); } catch {}
  const garder = () => { try { localStorage.setItem('lumi-compte', JSON.stringify(s)); } catch {} };
  const api = async (chemin, opts = {}, auth = true) => {
    const r = await fetch(url + chemin, { ...opts, headers: { apikey: cle, 'Content-Type': 'application/json', ...(auth && s ? { Authorization: 'Bearer ' + s.access_token } : {}), ...(opts.headers || {}) } });
    if (r.status === 401 && auth && s?.refresh_token && !opts._re) { await rafraichir(); return api(chemin, { ...opts, _re: true }, auth); }
    if (!r.ok) throw new Error(r.status + ' ' + (await r.text()));
    return r.status === 204 ? null : r.json().catch(() => null);
  };
  async function rafraichir() {
    const r = await api('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token: s.refresh_token }) }, false);
    s = { ...s, ...r }; garder();
  }
  // tout ce qui appartient aux enfants
  function paquet() {
    const d = { profils: Profils.exporter(), enfants: {} };
    Profils.liste.forEach((p) => { d.enfants[p.id] = {}; ['lumi-progres', 'lumi-coloriages'].forEach((b) => { try { d.enfants[p.id][b] = JSON.parse(localStorage.getItem(Profils.cle(b, p.id)) || 'null'); } catch {} }); });
    return d;
  }
  const etoiles = (id) => { try { return JSON.parse(localStorage.getItem(Profils.cle('lumi-progres', id)) || '{}').etoiles || 0; } catch { return 0; } };
  function fusionner(d) {
    if (!d?.profils?.liste) return;
    const ici = Profils.exporter(), ids = new Set(ici.liste.map((p) => p.id));
    d.profils.liste.forEach((p) => { if (!ids.has(p.id)) ici.liste.push(p); });
    Profils.importer(ici);
    Object.entries(d.enfants || {}).forEach(([id, x]) => {
      if ((x?.['lumi-progres']?.etoiles || 0) < etoiles(id)) return; // on garde le plus avancé
      Object.entries(x || {}).forEach(([b, v]) => { if (v) try { localStorage.setItem(Profils.cle(b, id), JSON.stringify(v)); } catch {} });
    });
  }
  async function envoyer() {
    if (!s) return;
    await api('/rest/v1/familles', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates' }, body: JSON.stringify({ user_id: s.user.id, donnees: paquet(), maj: new Date().toISOString() }) });
    derniere = Date.now();
  }
  async function recevoir() {
    const r = await api(`/rest/v1/familles?user_id=eq.${s.user.id}&select=donnees`);
    if (r?.[0]?.donnees) fusionner(r[0].donnees);
  }
  return {
    dispo, get email() { return s?.user?.email || null; }, get id() { return s?.user?.id || null; }, get derniereSynchro() { return derniere; },
    envoyerCode: (email) => api('/auth/v1/otp', { method: 'POST', body: JSON.stringify({ email, create_user: true }) }, false),
    async verifier(email, token) {
      s = await api('/auth/v1/verify', { method: 'POST', body: JSON.stringify({ type: 'email', email, token }) }, false); garder();
      await recevoir(); await envoyer(); await Achat.init(s.user.id);
    },
    sortir() { s = null; try { localStorage.removeItem('lumi-compte'); } catch {} },
    async supprimer() { await api('/functions/v1/supprimer-compte', { method: 'POST', body: '{}' }); this.sortir(); },
    changement() { if (!s) return; clearTimeout(minuteur); minuteur = setTimeout(() => envoyer().catch(() => {}), 4000); },
    async init() { if (!dispo || !s) return; try { await rafraichir(); await recevoir(); } catch {} },
  };
})();

// ----- Le profil de l'enfant dans le bandeau d'accueil -----
function bandeauEnfant() {
  const p = Profils.actif, b = document.createElement('button');
  b.type = 'button'; b.className = 'fa-moi';
  b.innerHTML = '<span class="e"></span><span class="n"></span>';
  b.querySelector('.e').textContent = p.avatar; b.querySelector('.n').textContent = p.nom || '';
  b.onclick = (e) => { e.stopPropagation(); choisirEnfant(); };
  return b;
}
async function demarrerFamille() {
  if (PLUGINS.StatusBar) { try { await PLUGINS.StatusBar.setStyle({ style: 'DARK' }); if (PLATEFORME === 'android') { await PLUGINS.StatusBar.setBackgroundColor({ color: '#0d1026' }); await PLUGINS.StatusBar.setOverlaysWebView({ overlay: false }); } } catch {} }
  await Famille.init();
  await Achat.init(Famille.id);
  if (Profils.liste.length > 1 && !sessionStorage.getItem('lumi-qui')) { try { sessionStorage.setItem('lumi-qui', '1'); } catch {} choisirEnfant(); }
}

// ---------- Au démarrage : l'accueil, et le mot du jour dessiné en silence ----------
choisirLangue(langue);
accueillir();
demarrerFamille();
setTimeout(() => { avatar?.mode(paletteAmb); avatar?.forme(duJour().mot.emoji); revenirAuNuage(8000); }, 600);

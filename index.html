<style>
  :root {
    color-scheme: dark;
    --fond-rgb: 13, 16, 38; /* change selon l'ambiance du thème */
    --nuit: rgb(var(--fond-rgb));
    --carte: rgba(255, 255, 255, .07);
    --bord: rgba(255, 255, 255, .12);
    --soleil: #ffd166;
    --bonbon: #ff8fab;
    --ciel: #7cc6fe;
    --menthe: #7de2c3;
    --lilas: #c3a6ff;
    --encre: #1b1030;     /* texte sur les tuiles colorées */
    --texte: #f4f1ff;
    --doux: #a9a6cf;
    --amp: 0;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  /* pas de zoom au double-tap, pas de sélection ni de loupe au doigt long */
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input { -webkit-user-select: text; user-select: text; }
  body {
    margin: 0; background: var(--nuit); color: var(--texte); transition: background-color 1.2s;
    font: 500 17px/1.35 "Baloo 2", system-ui, sans-serif;
    display: flex; justify-content: center; padding-inline: 16px;
  }
  .app[dir="rtl"] { font-family: "Baloo Bhaijaan 2", "Baloo 2", system-ui, sans-serif; }
  .app {
    position: relative; z-index: 1;
    width: 100%; max-width: 480px; min-height: 100%; display: flex; flex-direction: column; gap: 10px;
    padding-bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 56px); /* place pour la barre du navigateur */
  }
  button { font: inherit; color: inherit; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--ciel); outline-offset: 2px; }

  /* ---------- Barre du haut ---------- */
  .haut { display: flex; align-items: center; gap: 10px; min-height: 72px;
          position: sticky; top: 0; z-index: 20; margin-inline: -16px;
          padding: max(10px, env(safe-area-inset-top, 0px)) 16px 10px;
          background: rgba(var(--fond-rgb), .9); transition: background-color 1.2s; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
          border-bottom: 1px solid rgba(38, 43, 85, .6); }
  .haut h1 { margin: 0; flex: 1; min-width: 0; font-size: clamp(20px, 5.4vw, 30px); font-weight: 800; line-height: 1.1; letter-spacing: -.01em;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Gros boutons, faciles à toucher pour un petit doigt */
  .retour { width: 60px; height: 60px; flex: none; border-radius: 20px; background: var(--soleil); color: #2a1f00;
            font-size: 32px; font-weight: 900; line-height: 1; display: grid; place-items: center;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.3); }
  .retour[hidden] { display: none; }
  .retour:active, .bouton-son:active, .bouton-langue:active { transform: scale(.92); }
  .retour.maison { background: var(--menthe); font-size: 28px; }
  .app[dir="rtl"] .retour span { display: inline-block; transform: scaleX(-1); }
  .bouton-son { width: 56px; height: 56px; flex: none; border-radius: 50%; background: var(--carte); border: 2px solid var(--bord); font-size: 26px; }
  .bouton-langue { flex: none; min-width: 64px; height: 56px; padding: 0 14px; border-radius: 99px; background: var(--soleil); color: #2a1f00;
                   font-weight: 900; font-size: 19px; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
                   box-shadow: inset 0 -4px 0 rgba(0,0,0,.15); }
  .bouton-langue::before { content: '🌍'; font-size: 16px; }
  .langues { display: flex; flex: none; background: var(--carte); border: 1px solid var(--bord); border-radius: 99px; padding: 3px; }
  .langues button { min-width: 42px; padding: 4px 10px; border-radius: 99px; background: none; color: var(--doux); font-weight: 700; }
  .langues button[aria-pressed="true"] { background: var(--soleil); color: #2a1f00; }

  /* ---------- Corps : Lumi d'un côté, l'activité de l'autre ---------- */
  .corps { display: flex; flex-direction: column; gap: 10px; }
  .cote-lumi { display: flex; flex-direction: column; gap: 6px; }
  .scene { position: relative; width: 100%; aspect-ratio: 1; max-height: 38vh; margin-inline: auto; transition: max-height .4s; }
  [data-ecran="accueil"] .scene { max-height: 30vh; }
  canvas#rendu { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .repli { display: none; }
  canvas#trace { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; touch-action: none; cursor: crosshair; }
  .trace-fermer { position: absolute; top: 6px; inset-inline-end: 6px; z-index: 3; width: 44px; height: 44px; border-radius: 50%;
                  background: var(--carte); border: 1px solid var(--bord); font-size: 18px; }
  .trace-progres { position: absolute; inset-inline: 18%; bottom: 10px; height: 10px; border-radius: 99px; background: var(--carte); z-index: 3; overflow: hidden; }
  .trace-progres span { display: block; height: 100%; width: 0; background: var(--soleil); border-radius: 99px; transition: width .2s; }

  /* Carte du mot : emoji, mot, lettres */
  .carte { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .carte .emoji { font-size: 44px; line-height: 1; filter: drop-shadow(0 4px 12px rgba(255, 209, 102, .25)); }
  .carte .mot { font-size: 34px; font-weight: 800; line-height: 1.1; text-wrap: balance; }
  .carte .mot .article { font-size: .62em; font-weight: 700; color: var(--doux); margin-inline-end: .12em; }
  .carte .sous { font-size: 16px; color: var(--doux); text-wrap: balance; }
  .tuiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .tuile {
    min-width: 38px; height: 44px; padding-inline: 8px; border-radius: 12px; display: grid; place-items: center;
    background: var(--carte); border: 1px solid var(--bord); font-size: 22px; font-weight: 800; color: var(--doux);
    transition: transform .2s, background .2s, color .2s;
  }
  .tuile.allumee { background: var(--soleil); color: #2a1f00; border-color: var(--soleil); transform: translateY(-4px) scale(1.08); }
  .tuile.vue { color: var(--texte); }
  .tuile.cle { border: 2px solid var(--soleil); color: var(--soleil); }
  .tuile.espace { background: none; border: none; min-width: 12px; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .carte .emoji { display: inline-block; }
  .carte .emoji, .carte .mot { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  .bouton-trace { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; padding: 8px 18px; border-radius: 99px;
                  background: var(--soleil); color: #2a1f00; font-weight: 800; font-size: 17px; }

  /* ---------- Accueil : grandes tuiles colorées ---------- */
  .du-jour { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .carte-jour { border-radius: 20px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--encre); }
  .carte-jour:nth-child(1) { background: var(--soleil); } .carte-jour:nth-child(2) { background: var(--ciel); } .carte-jour:nth-child(3) { background: var(--menthe); }
  .carte-jour .t { font-size: 13px; font-weight: 700; line-height: 1.15; text-wrap: balance; }
  .carte-jour .grand { font-size: 40px; font-weight: 800; line-height: 1.1; }
  .titre-section { margin: 6px 0 0; font-size: 14px; font-weight: 700; color: var(--doux); text-transform: uppercase; letter-spacing: .06em; }
  .grille { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .univers { min-height: 104px; border-radius: 22px; padding: 12px 10px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
             color: var(--encre); text-align: start; transition: transform .15s; }
  .univers:active { transform: scale(.96); }
  .univers .e { font-size: 38px; line-height: 1; }
  .univers .n { font-size: 18px; font-weight: 800; line-height: 1.1; text-wrap: balance; }
  .univers .d { font-size: 13px; font-weight: 600; opacity: .75; line-height: 1.2; }
  .u0 { background: var(--soleil); } .u1 { background: var(--bonbon); } .u2 { background: var(--ciel); } .u3 { background: var(--menthe); } .u4 { background: var(--lilas); }

  /* ---------- Liste d'un thème ---------- */
  .panneau { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .objet { min-height: 90px; border-radius: 18px; background: var(--carte); border: 1px solid var(--bord);
           display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 4px; }
  .objet .e { font-size: 36px; line-height: 1.1; }
  .objet .n { font-size: 14px; line-height: 1.15; text-wrap: balance; }
  .objet:active { transform: scale(.95); }
  .objet.tout { background: var(--bonbon); color: #3a0716; border: none; font-weight: 800; }
  .objet.a-toi { background: var(--menthe); color: #05281e; }
  .objet.juste { border-color: var(--menthe); background: rgba(125, 226, 195, .25); animation: hop .5s; }
  .objet.faux { animation: non .4s; }
  @keyframes hop { 40% { transform: scale(1.12); } }
  .objet.lettre .e { font-size: 32px; font-weight: 800; }
  .objet.c0 .e { color: var(--soleil); } .objet.c1 .e { color: var(--bonbon); } .objet.c2 .e { color: var(--ciel); } .objet.c3 .e { color: var(--menthe); }

  /* ---------- Parle à Lumi ---------- */
  .aide { margin: 0; text-align: center; color: var(--doux); text-wrap: balance; }
  .commandes { display: flex; justify-content: center; align-items: center; gap: 22px; }
  .rond { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: var(--carte); border: 1px solid var(--bord); font-size: 22px; }
  .micro { width: 96px; height: 96px; background: var(--bonbon); color: #3a0716; border: none;
           box-shadow: 0 0 0 calc(var(--amp) * 14px) rgba(255, 143, 171, .25), 0 8px 24px rgba(255, 143, 171, .35); }
  .micro svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
  .micro.ecoute { background: var(--menthe); color: #05281e; animation: battement 1s ease-in-out infinite; }
  @keyframes battement { 50% { transform: scale(1.07); } }
  .legende { text-align: center; color: var(--doux); font-size: 15px; }
  .ecrire { display: flex; gap: 8px; }
  .ecrire input { flex: 1; min-width: 0; font: inherit; font-size: 18px; color: var(--texte); background: var(--carte); border: 1px solid var(--bord); border-radius: 99px; padding: 10px 18px; }
  .ecrire button { padding: 0 18px; border-radius: 99px; background: var(--soleil); color: #2a1f00; font-weight: 800; }
  .exemples { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .exemples button { padding: 6px 14px; border-radius: 99px; background: var(--carte); border: 1px solid var(--bord); }

  /* ---------- Jeu « Devine ! » ---------- */
  .score { text-align: center; font-size: 20px; font-weight: 800; color: var(--soleil); }
  .jeu-haut { display: flex; justify-content: center; align-items: center; gap: 16px; }
  .reecouter { padding: 6px 16px; border-radius: 99px; background: var(--ciel); color: var(--encre); font-weight: 800; }
  .choix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .choix[data-n="4"] { grid-template-columns: repeat(2, 1fr); }
  .choix[data-n="4"] button { aspect-ratio: 4 / 3; }
  .choix button { aspect-ratio: 1; border-radius: 24px; background: var(--carte); border: 2px solid var(--bord); font-size: clamp(40px, 12vw, 64px); }
  .choix button.juste { border-color: var(--menthe); background: #17403a; }
  .choix button.faux { animation: non .4s; }
  @keyframes non { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  /* Petit téléphone : en-tête plus compact pour que le titre reste lisible */
  @media (max-width: 430px) {
    .haut { gap: 7px; min-height: 66px; }
    .retour { width: 54px; height: 54px; font-size: 28px; }
    .bouton-son { width: 50px; height: 50px; font-size: 22px; }
    .bouton-langue { min-width: 54px; height: 50px; padding: 0 10px; font-size: 16px; }

  /* ---------- Progression : bandeau, album, pouvoirs ---------- */

  .autocollants { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin-bottom: 6px; }

  .bulle { position: absolute; bottom: -110px; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center;
           font-size: 48px; border: 2px solid rgba(190, 230, 255, .6);
           background: radial-gradient(circle at 30% 28%, rgba(255,255,255,.55), rgba(124,198,254,.18) 45%, rgba(124,198,254,.06) 70%);
           box-shadow: inset 0 0 18px rgba(190,230,255,.25); animation: bulleMonte var(--d) linear forwards; }

  .bulle span { display: block; transition: transform .3s, opacity .3s; }

  /* ---------- Décor d'ambiance : léger, derrière rien d'important, jamais cliquable ---------- */
  /* le décor flotte DERRIÈRE l'app ; les effets (confettis, gouttes, notes) passent devant */
  #decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; opacity: .7; }
  #effets { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
  #effets > * { position: absolute; }
  #decor span { position: absolute; left: var(--x); top: var(--y); opacity: 0; will-change: transform, opacity; }
  .d-etoile { width: 3px; height: 3px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px #fff;
              animation: scintille var(--d) ease-in-out var(--r) infinite; }
  @keyframes scintille { 0%, 100% { opacity: 0; } 50% { opacity: calc(.55 * var(--t)); } }
  .d-bulle { top: auto !important; bottom: -30px; width: calc(10px * var(--t)); height: calc(10px * var(--t)); border-radius: 50%;
             border: 1.5px solid rgba(180, 225, 255, .5); background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.5), transparent 60%);
             animation: monte var(--d) linear var(--r) infinite; }
  .d-monte { top: auto !important; bottom: -40px; font-weight: 800; font-size: calc(26px * var(--t)); color: var(--c);
             animation: monte calc(var(--d) * 1.4) linear var(--r) infinite; }
  @keyframes monte { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: .22; } 50% { transform: translate(18px, -55vh); }
                     90% { opacity: .18; } 100% { transform: translate(-10px, -110vh); opacity: 0; } }
  .d-chute { top: -40px !important; font-size: calc(22px * var(--t)); animation: tombe var(--d) linear var(--r) infinite; }
  @keyframes tombe { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: .4; }
                     50% { transform: translate(40px, 55vh) rotate(160deg); } 90% { opacity: .35; } 100% { transform: translate(-20px, 110vh) rotate(320deg); opacity: 0; } }
  .d-nuage { left: -120px !important; top: calc(var(--y) * .6) !important; font-size: calc(54px * var(--t)); filter: blur(1px);
             animation: derive calc(var(--d) * 3) linear var(--r) infinite; }
  @keyframes derive { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: .22; } 92% { opacity: .22; } 100% { transform: translateX(calc(100vw + 240px)); opacity: 0; } }
  .d-lumiere { width: calc(40px * var(--t)); height: calc(40px * var(--t)); border-radius: 50%; background: var(--c); filter: blur(14px);
               animation: flotte var(--d) ease-in-out var(--r) infinite alternate; }
  @keyframes flotte { 0% { transform: translate(0, 0); opacity: .05; } 50% { opacity: .22; } 100% { transform: translate(30px, -40px); opacity: .08; } }
  .d-luciole { width: 5px; height: 5px; border-radius: 50%; background: #e8ff8a; box-shadow: 0 0 10px 3px rgba(220, 255, 120, .7);
               animation: luciole var(--d) ease-in-out var(--r) infinite alternate; }
  @keyframes luciole { 0% { transform: translate(0, 0); opacity: 0; } 30% { opacity: .9; } 50% { opacity: .1; } 70% { opacity: .8; }
                       100% { transform: translate(60px, -50px); opacity: 0; } }

  /* Téléphone : une tuile seule en fin de grille prend toute la largeur */
  @media (max-width: 759px) { .grille > .univers:last-child:nth-child(odd) { grid-column: 1 / -1; min-height: 88px; } }

  /* ---------- Tablette en vertical : une colonne, tout en plus grand ---------- */

    body { font-size: 19px; }
    .app { max-width: 860px; gap: 14px; }
    .scene, [data-ecran="accueil"] .scene { max-height: 36vh; }
    .carte .emoji { font-size: 56px; } .carte .mot { font-size: 46px; }

    .carte-jour .grand { font-size: 60px; } .carte-jour .t { font-size: 16px; }

  @media (min-width: 900px) and (orientation: landscape) {

  @media (prefers-reduced-motion: reduce) { #decor { display: none; } }
  @media (prefers-reduced-motion: reduce) { .micro.ecoute, .carte .emoji, .carte .mot, .choix button.faux { animation: none; } }

  /* ---------- Coloriage ---------- */
  [data-ecran="coloriage"] .cote-lumi { display: none; }
  .coloriage { display: grid; gap: 12px; grid-template-areas: "bulle" "feuille" "palette" "actions" "autres"; }
  .col-bulle { grid-area: bulle; display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 22px;
               background: var(--carte); border: 1px solid var(--bord); min-height: 64px; }
  .col-bulle .lumi { flex: none; width: 46px; height: 46px; border-radius: 50%;
                     background: radial-gradient(circle at 40% 35%, #fff 0 12%, var(--c) 45%, transparent 72%);
                     box-shadow: 0 0 24px var(--c); animation: respire 3s ease-in-out infinite; }
  .col-bulle .txt { font-size: 26px; font-weight: 800; line-height: 1.1; }

  @keyframes respire { 50% { transform: scale(1.08); } }
  @keyframes bondit { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .feuille { grid-area: feuille; position: relative; background: #fffdf7; border-radius: 26px; padding: 10px;

  .feuille svg *, .mini svg * { stroke: #1b1030; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  .feuille .z, .mini .z { fill: #fff; transition: fill .25s; }
  .feuille .z { cursor: pointer; }
  .feuille .z.peint { animation: peint .35s ease-out; transform-box: fill-box; transform-origin: center; }
  @keyframes peint { 40% { transform: scale(1.04); } }
  .palette { grid-area: palette; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 10px;
             border-radius: 22px; background: var(--carte); border: 1px solid var(--bord); }
  .pastille { aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer; position: relative;
              background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.75) 0 10%, transparent 34%), var(--c);
              box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), 0 4px 10px rgba(0,0,0,.35); transition: transform .15s; }
  .pastille:active { transform: scale(.9); }
  .pastille.actif { transform: scale(1.14) translateY(-3px); box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), 0 0 0 4px #fff, 0 0 20px var(--c); }
  .pastille.actif::after { content: '✓'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 900;
                           color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .col-actions { grid-area: actions; display: grid; grid-template-columns: 1fr 1.3fr 1.6fr; gap: 10px; }
  .col-actions button { padding: 14px 8px; border-radius: 18px; border: 1px solid var(--bord); background: var(--carte);
                        color: inherit; font: inherit; font-size: 19px; font-weight: 800; cursor: pointer; }
  .col-actions button:active { transform: scale(.95); }
  .col-actions .magie { background: linear-gradient(135deg, #a855f7, #f472b6); border: none; color: #fff; }
  .col-actions .fini { background: linear-gradient(135deg, var(--menthe), var(--soleil)); color: #1b1030; border: none; }
  .col-autres { grid-area: autres; display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
  .col-autres .autre { flex: none; width: 74px; padding: 5px; border-radius: 16px; background: #fffdf7; border: 3px solid transparent; cursor: pointer; }
  .col-autres .autre.ici { border-color: var(--soleil); transform: scale(1.05); }
  .mini svg { display: block; width: 100%; height: auto; border-radius: 10px; }
  .univers.a-colorier .mini { width: 64px; background: #fffdf7; border-radius: 14px; padding: 4px; }
  #effets .goutte { position: fixed; width: 14px; height: 14px; border-radius: 50%; }
  @media (min-width: 600px) {
    .palette { grid-template-columns: repeat(10, 1fr); }
    .col-bulle .txt { font-size: 32px; }
    .col-autres .autre { width: 90px; }
  }
  @media (min-width: 900px) and (orientation: landscape) {
    [data-ecran="coloriage"] .corps { grid-template-columns: 1fr; }
    .coloriage { grid-template-columns: 1fr 360px; grid-template-rows: auto auto auto 1fr auto;
                 grid-template-areas: "feuille bulle" "feuille palette" "feuille actions" "feuille ." "autres autres"; align-items: start; }
    .palette { grid-template-columns: repeat(5, 1fr); }

  }
  /* ---------- Comptines ---------- */
  [data-ecran="chansons"] .carte, [data-ecran="histoires"] .carte { display: none; }
  [data-ecran="chansons"] .scene, [data-ecran="histoires"] .scene { max-height: 32vh; }
  .chansons { display: flex; flex-direction: column; gap: 10px; }
  .ch-lecteur { border-radius: 24px; background: var(--carte); border: 1px solid var(--bord); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .ch-haut { display: flex; align-items: center; gap: 8px; }

  .ch-commandes button.on { background: var(--soleil); border-color: var(--soleil); }
  .ch-commandes #ch-lecture, .ch-commandes #hi-lecture { width: 58px; height: 58px; background: linear-gradient(135deg, var(--menthe), var(--soleil)); color: #1b1030; border: none; font-size: 26px; }
  .ch-lecteur.vide .ch-paroles { display: none; }
  .ch-paroles { min-height: 92px; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 4px 8px; text-align: center; }
  .ch-ligne { display: none; margin: 0; font-weight: 800; line-height: 1.3; }

  .puce.on { background: var(--soleil); color: #2a1f00; border-color: var(--soleil); }

  .ch-liste { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 4px 0 10px; }

              align-items: flex-start; justify-content: space-between; text-align: start; color: #1b1030; font-weight: 800; font-size: 15px; line-height: 1.15;
              box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }

  @media (min-width: 600px) and (min-height: 900px) { [data-ecran="chansons"] .scene, [data-ecran="histoires"] .scene { max-height: 48vh; } }
  @media (min-width: 600px) { .ch-ligne.active { font-size: 32px; } .ch-ligne.suivante { font-size: 21px; } .ch-tuile { height: 130px; } .ch-liste { grid-template-columns: repeat(4, 1fr); } }
  /* ---------- Histoires du soir ---------- */

<script>
const avatar = (() => {
  const canvas = document.getElementById('rendu');
  const gl = canvas.getContext('webgl', { alpha: false, antialias: false });
  if (!gl) { document.getElementById('scene').classList.add('sans3d'); return null; }

  const programme = (vs, fs) => {
    const p = gl.createProgram();
    [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(([type, src]) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
      gl.attachShader(p, s);
    });
    gl.linkProgram(p);
    return p;
  };

  // --- Halo de lumière derrière ---
  const HALO_FS = `
  precision highp float;
  uniform vec2 uRes, uDecal; uniform float uT, uAmp, uEnergie, uRespire, uProche; uniform vec3 uFond, uC2, uC3;
  void main(){
    vec2 uv = (gl_FragCoord.xy - .5*uRes) / min(uRes.x, uRes.y);
    float bord = smoothstep(.5, .26, length(uv));
    uv = (uv - uDecal) / (1. + uProche*.45);                  // le halo suit l'être quand il s'approche
    float r = length(uv), ang = atan(uv.y, uv.x);
    float g = (exp(-r*r*16.) * (.34 + uAmp*.4 + uEnergie*.06) + exp(-r*r*4.5) * (.09 + uAmp*.06)) * (1. + uRespire*4. + uProche*.9);
    float rayons = pow(.5 + .5*sin(ang*7. + uT*.12), 6.) * pow(.5 + .5*sin(ang*4. - uT*.09 + 1.), 4.) * exp(-r*4.2) * (.1 + uAmp*.12);
    vec3 c = uFond + (mix(uC2, uC3, .3)*g + uC3*rayons) * bord;
    gl_FragColor = vec4(c, 1.);
  }`;
  // --- Grains ---
  const GRAINS_VS = `
  attribute vec4 a;
  attribute vec3 aA, aB;                                      // forme précédente et forme visée
  attribute vec4 aCA, aCB;                                    // leurs couleurs (w = 1 : couleur de l'emoji)
  uniform vec2 uEchelle; uniform float uT, uAmp, uForme, uMix, uSerre, uTour, uDpr, uEnergie;
  uniform vec3 uC1, uC2, uC3;
  uniform float uRespire, uProche;                            // souffle, et distance à l'écran (0 = au fond)
  uniform vec2 uDecal;                                        // léger déplacement : il flotte, il se penche vers le doigt
  uniform vec3 uDoigt, uOnde0, uOnde1;                        // doigt (x, y, appui) ; ondes (x, y, âge en s, < 0 = aucune)
  varying vec3 vCol; varying float vA;
  mat2 rot(float x){ float c = cos(x), s = sin(x); return mat2(c, -s, s, c); }
  void main(){
    float s1 = a.x, s2 = a.y, s3 = a.z, s4 = a.w;
    float th = s1*6.2832, ph = acos(2.*s2 - 1.);
    float rr = pow(s3, .6);                                   // plus dense au centre
    vec3 dir = vec3(sin(ph)*cos(th), cos(ph), sin(ph)*sin(th));
    float R = .34 * rr * uSerre;
    R *= 1. + uAmp*.3*sin(rr*11. - uT*9.) + uAmp*.1;           // onde de voix qui traverse la poussière
    R *= 1. + uRespire;                                        // il respire
    vec3 p = dir * R;
    p.xz = rot(uT*uTour*(.5 + (1. - rr)*1.3) + s4*6.2832) * p.xz;   // tourbillon : le cœur tourne plus vite
    p += .028*vec3(sin(uT*.7 + s1*40. + p.y*7.), sin(uT*.6 + s2*40. + p.z*7.), sin(uT*.8 + s3*40. + p.x*7.)) * (1. + uEnergie);
    p.yz = rot(.42) * p.yz;
    // la poussière dessine une forme : chaque grain part avec un léger décalage et fait une courbe
    vec3 cible = mix(aA, aB, uMix);
    cible.xz = rot(sin(uT*.6)*.28) * cible.xz;
    cible *= 1. + uAmp*.08*sin(length(cible.xy)*30. - uT*10.);
    cible += .006*vec3(sin(uT*1.3 + s1*60.), sin(uT*1.1 + s2*60.), 0.);
    float f = smoothstep(0., 1., clamp(uForme*1.5 - s3*.5, 0., 1.)) * step(.1, s4);
    p = mix(p, cible, f) + vec3(-cible.y, cible.x, 0.) * sin(f*3.1416) * .5 * (s2 - .5);
    p.xy += uDecal;
    float z = 1.7 - p.z - uProche*.55;                          // il s'approche de la vitre
    vec2 sp = p.xy / z * 1.7;
    // toucher : des ondes parcourent la poussière, et les grains viennent vers le doigt
    float eclat = 0.;
    for (int k = 0; k < 2; k++) {
      vec3 o = k == 0 ? uOnde0 : uOnde1;
      if (o.z >= 0.) {
        vec2 dv = sp - o.xy; float d = length(dv) + 1e-4;
        float env = exp(-abs(d - o.z*.5) * 14.) * exp(-o.z*1.2);
        sp += dv / d * env * .075;
        eclat += env * 2.;
      }
    }
    vec2 dd = uDoigt.xy - sp;
    float attire = exp(-length(dd) * 7.) * uDoigt.z;
    sp += dd * attire * .22;
    eclat += attire * .8;
    gl_Position = vec4(sp * uEchelle, 0., 1.);
    float grand = pow(s4, 10.) * 5.;                            // quelques éclats plus gros
    gl_PointSize = (2.2 + grand) * uDpr * (1.7 / z) * (1. + uAmp*.6*s4) * (1. + eclat*.5);
    float scintille = .45 + .55*(.5 + .5*sin(uT*(1. + s2*3.) + s1*50.));
    vA = scintille * (.5 + .5*(1. - rr)) * .7 * (1. + eclat*1.6);
    vCol = mix(uC1, uC2, smoothstep(.1, .75, rr));
    vCol = mix(vCol, uC3, step(.82, s2) * .85);
    vec4 cc = mix(aCA, aCB, uMix);
    vCol = mix(vCol, cc.rgb * 1.3, f * cc.w * .9);
  }`;
  const GRAINS_FS = `
  precision mediump float;
  varying vec3 vCol; varying float vA;
  void main(){
    vec2 c = gl_PointCoord - .5;
    float g = exp(-dot(c, c)*22.);
    gl_FragColor = vec4(vCol * g * vA, 1.);
  }`;

  let pHalo, pGrains;
  try { pHalo = programme(`attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`, HALO_FS); pGrains = programme(GRAINS_VS, GRAINS_FS); }
  catch (e) { console.error(e); document.getElementById('scene').classList.add('sans3d'); return null; }

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const N = matchMedia('(max-width: 500px)').matches ? 6000 : 9000;
  const graines = new Float32Array(N * 4).map(() => Math.random());
  const bufGrains = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, bufGrains);
  gl.bufferData(gl.ARRAY_BUFFER, graines, gl.STATIC_DRAW);
  // Formes : dessinées sur un petit canevas, puis chaque grain reçoit un point au hasard dans le dessin
  const FORMES = {
    question(g) { g.font = '800 150px Sora, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', 80, 86); },
    euro(g) { g.font = '700 130px Sora, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('€', 80, 86); },
    recherche(g) { g.lineWidth = 14; g.beginPath(); g.arc(66, 66, 40, 0, 7); g.stroke(); g.lineWidth = 20; g.beginPath(); g.moveTo(96, 96); g.lineTo(136, 136); g.stroke(); },
    horloge(g) { g.lineWidth = 11; g.beginPath(); g.arc(80, 80, 60, 0, 7); g.stroke(); g.lineWidth = 10; g.beginPath(); g.moveTo(80, 80); g.lineTo(80, 42); g.moveTo(80, 80); g.lineTo(110, 94); g.stroke(); },
    check(g) { g.lineWidth = 9; g.beginPath(); g.arc(80, 80, 64, 0, 7); g.stroke(); g.lineWidth = 17; g.beginPath(); g.moveTo(48, 82); g.lineTo(72, 106); g.lineTo(116, 56); g.stroke(); },
    coeur(g) { g.beginPath(); g.moveTo(80, 136); g.bezierCurveTo(10, 90, 14, 30, 56, 30); g.bezierCurveTo(70, 30, 78, 40, 80, 50); g.bezierCurveTo(82, 40, 90, 30, 104, 30); g.bezierCurveTo(146, 30, 150, 90, 80, 136); g.fill(); },
    bol(g) { // bol de nouilles, baguettes et vapeur
      g.beginPath(); g.moveTo(18, 84); g.lineTo(142, 84); g.arc(80, 84, 62, 0, Math.PI); g.fill();
      g.lineWidth = 6; [52, 70, 88, 106].forEach((x) => { g.beginPath(); g.moveTo(x, 84); g.bezierCurveTo(x - 8, 68, x + 8, 60, x, 46); g.stroke(); });
      g.lineWidth = 7; g.beginPath(); g.moveTo(104, 60); g.lineTo(146, 14); g.moveTo(114, 64); g.lineTo(152, 26); g.stroke();
      g.lineWidth = 4; [44, 62].forEach((x) => { g.beginPath(); g.moveTo(x, 36); g.bezierCurveTo(x - 8, 26, x + 8, 18, x, 6); g.stroke(); });
    },
    gyoza(g) { // un ravioli en contour, avec ses plis sur le dessus
      g.lineWidth = 10;
      g.beginPath(); g.moveTo(14, 104); g.quadraticCurveTo(80, 142, 146, 104); g.quadraticCurveTo(140, 30, 80, 28); g.quadraticCurveTo(20, 30, 14, 104); g.stroke();
      g.lineWidth = 7;
      [[44, 44, 50, 70], [62, 34, 64, 62], [80, 30, 80, 58], [98, 34, 96, 62], [116, 44, 110, 70]].forEach(([x1, y1, x2, y2]) => { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); });
    },
    anneau(g) { g.lineWidth = 12; g.beginPath(); g.arc(80, 80, 58, 0, 7); g.stroke(); [0, 2.1, 4.2].forEach((a) => { g.beginPath(); g.arc(80 + Math.cos(a) * 58, 80 + Math.sin(a) * 58, 12, 0, 7); g.fill(); }); },
    crayon(g) { // crayon qui écrit une ligne
      g.save(); g.translate(92, 64); g.rotate(Math.PI / 4);
      g.fillRect(-14, -58, 28, 84); g.beginPath(); g.moveTo(-14, 30); g.lineTo(14, 30); g.lineTo(0, 58); g.closePath(); g.fill();
      g.save(); g.globalCompositeOperation = 'destination-out'; g.fillRect(-15, 18, 30, 5); g.restore(); g.restore();
      g.lineWidth = 7; g.beginPath(); g.moveTo(14, 140); g.bezierCurveTo(30, 124, 42, 150, 56, 136); g.stroke();
    },
    engrenage(g) {
      g.beginPath();
      for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, r = i % 2 ? 50 : 66; g.lineTo(80 + Math.cos(a) * r, 80 + Math.sin(a) * r); }
      g.closePath(); g.fill();
      g.save(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(80, 80, 22, 0, 7); g.fill(); g.restore();
    },
    sablier(g) { g.lineWidth = 9; g.beginPath(); g.moveTo(40, 22); g.lineTo(120, 22); g.moveTo(40, 138); g.lineTo(120, 138);
      g.moveTo(48, 22); g.lineTo(80, 80); g.lineTo(48, 138); g.moveTo(112, 22); g.lineTo(80, 80); g.lineTo(112, 138); g.stroke();
      g.beginPath(); g.moveTo(58, 132); g.lineTo(102, 132); g.lineTo(80, 104); g.closePath(); g.fill(); },
    erreur(g) { g.lineWidth = 10; g.beginPath(); g.moveTo(80, 18); g.lineTo(148, 138); g.lineTo(12, 138); g.closePath(); g.stroke();
      g.lineWidth = 14; g.beginPath(); g.moveTo(80, 62); g.lineTo(80, 100); g.stroke(); g.beginPath(); g.arc(80, 120, 8, 0, 7); g.fill(); },
  };
  const cacheFormes = {};
  // Une forme = des positions (x, y, z) et des couleurs (r, g, b, w) pour chaque grain.
  // Nom connu → dessin ci-dessus. Sinon, n'importe quel emoji ou mot est dessiné puis échantillonné.
  function pointsForme(nom) {
    const zoom = window.LUMI_ZOOM || 1, cle = nom + "|" + zoom;
    if (cacheFormes[cle]) return cacheFormes[cle];
    const T = 160, c = document.createElement('canvas'); c.width = c.height = T;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.fillStyle = g.strokeStyle = '#fff'; g.lineCap = g.lineJoin = 'round';
    if (FORMES[nom]) FORMES[nom](g);
    else if (window.LUMI_DESSINS && window.LUMI_DESSINS[nom]) window.LUMI_DESSINS[nom](g);
    else {
      const lignes = nom.split('\n');
      let taille = 130 / Math.max(1, lignes.length * .85);
      const police = (px) => `700 ${px}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", Sora, system-ui, sans-serif`;
      g.font = police(taille);
      const larg = Math.max(...lignes.map((l) => g.measureText(l).width));

const normaliser = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')

function chercher(phrase) {
  const n = sansArticle(normaliser(phrase));
  for (const e of [n, n.replace(/s$/, ''), n.replace(/x$/, '')]) if (INDEX.has(e)) return INDEX.get(e);
  // une phrase (« je veux un dinosaure ») : chaque paire de mots, puis chaque mot
  const mots = n.split(' ').map(sansArticle);
  for (let i = 0; i < mots.length - 1; i++) { const p = mots[i] + ' ' + mots[i + 1]; if (INDEX.has(p)) return INDEX.get(p); }
  for (const w of mots) for (const e of [w, w.replace(/s$/, '')]) if (INDEX.has(e)) return INDEX.get(e);
  return approcher(mots);
}

const sonore = (w) => w.replace(/ph/g, 'f').replace(/y/g, 'i').replace(/qu|k/g, 'c').replace(/eau|au/g, 'o').replace(/ai|ei/g, 'e')
  .replace(/(.)\1/g, '$1').replace(/h/g, '').replace(/[estx]$/, '');
const PROCHES = {}; // par langue : on ne rapproche que des mots de la langue choisie
function ecart(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  let prec = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cour = [i];
    for (let k = 1; k <= b.length; k++) cour[k] = Math.min(prec[k] + 1, cour[k - 1] + 1, prec[k - 1] + (a[i - 1] === b[k - 1] ? 0 : 1));
    prec = cour;
  }
  return prec[b.length];
}
function approcher(mots) {
  if (!PROCHES[langue]) {
    const liste = [];
    MOTS.forEach((m) => m[langue].forEach((w) => { const k = sansArticle(normaliser(w)); if (!k.includes(' ')) liste.push([k, sonore(k), m]); }));
    PROCHES[langue] = liste;
  }
  let meilleur = null, score = 9;
  for (const w of mots) {
    if (w.length < 4) continue;
    const s = sonore(w), permis = w.length >= 9 ? 2 : w.length >= 5 ? 1 : 0;
    for (const [k, ks, m] of PROCHES[langue]) {
      if (ks === s) return m;
      if (k.slice(0, 2) !== w.slice(0, 2)) continue;
      const d = ecart(w, k);
      if (d <= permis && d < score) { score = d; meilleur = m; }
    }

}

let audio = null;
function son(type = 'pop') {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const t = audio.currentTime;
    const notes = { pop: [[620, 0, .09]], juste: [[660, 0, .12], [990, .1, .2]], faux: [[200, 0, .2]] }[type];
    notes.forEach(([f, d, duree]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type === 'faux' ? 'triangle' : 'sine';
      o.frequency.setValueAtTime(f, t + d);
      if (type === 'pop') o.frequency.exponentialRampToValueAtTime(f * 1.7, t + d + duree);
      g.gain.setValueAtTime(.0001, t + d);
      g.gain.exponentialRampToValueAtTime(.16, t + d + .015);
      g.gain.exponentialRampToValueAtTime(.0001, t + d + duree);
      o.connect(g).connect(audio.destination);
      o.start(t + d); o.stop(t + d + duree + .03);
    });
  } catch {}
}

document.addEventListener('pointerdown', (e) => { if (audio && e.target.closest('button') && !e.target.closest('#choix')) son('pop'); }, true);

// Sur téléphone, si Lumi est sorti de l'écran (liste longue), on remonte pour le voir dessiner
function voirLumi() {
  if (matchMedia('(min-width: 900px) and (orientation: landscape)').matches) return;
  const r = $('scene').getBoundingClientRect();
  if (r.top < 40 || r.top > innerHeight * .5) window.scrollTo({ top: 0, behavior: 'smooth' });
}

const pause = (ms, j) => new Promise((ok, ko) => setTimeout(() => (j === jeton ? ok() : ko()), ms));

// ---------- Carte du mot ----------
function carte(emoji, mot, sous = '', tuiles = true, article = '') {
  const e = $('carte-emoji'), m = $('carte-mot');
  e.textContent = emoji; m.textContent = ''; $('carte-sous').textContent = sous;
  if (article) { const a = document.createElement('span'); a.className = 'article'; a.textContent = article; m.append(a); }
  m.append(mot);
  [e, m].forEach((x) => { x.style.animation = 'none'; void x.offsetWidth; x.style.animation = ''; });
  $('tuiles').innerHTML = '';
  if (!tuiles) return;
  Array.from(typeof tuiles === 'string' ? tuiles : mot).forEach((c) => {
    const vide = /[\s-]/.test(c), t = document.createElement('button');
    t.type = 'button'; t.className = 'tuile' + (vide ? ' espace' : ''); t.textContent = vide ? '' : c;
    if (!vide) t.onclick = () => { diapo++; montrerLettre(c, true); };
    $('tuiles').appendChild(t);
  });
}

async function epeler(j) {
  for (const t of [...$('tuiles').children].filter((t) => !t.classList.contains('espace'))) {
    t.classList.add('allumee'); avatar?.syllabe();
    await pause(380, j);
    t.classList.remove('allumee'); t.classList.add('vue');
  }
}

function revenirAuNuage(ms) {
  clearTimeout(retourNuage);
  retourNuage = setTimeout(() => { avatar?.forme(null); avatar?.mode('attente'); }, ms);
}

 the night!","Black, like a crow!"],"ar":["اللون الأسود مثل الليل!","اللون الأسود مثل الغراب!"]},"⚪":{"fr":["Le blanc, comme la neige !","Le blanc, comme le lait !"],"en":["White, like the snow!","White, like fresh milk!"],"ar":["اللون الأبيض مثل الثلج!","اللون الأبيض مثل الحليب!"]},"🩷":{"fr":["Le rose, comme un flamant rose !","Le rose, comme la barbe à papa !"],"en":["Pink, like a flamingo!","Pink, like cotton candy!"],"ar":["اللون الوردي مثل الفلامنغو!","اللون الوردي مثل حلوى القطن!"]}};
function phraseDe(entree, theme) {
  const x = nomComplet(entree), cri = CRIS[entree.emoji];
  const propre = PHRASES_MOTS[entree.emoji]?.[langue];
  if (propre && !(cri && Math.random() < .35)) return hasardDe(propre);
  if (cri) {
    return { fr: `${majuscule(x)} fait ${cri[0]} !`, en: `The ${x} says ${cri[1]}!`, ar: `${x}: ${cri[2]}!` }[langue];
  }
  const p = PHRASES[theme] || PHRASES.defaut;
  return majuscule(hasardDe(p[langue]).replace('{x}', x));
}

// ---------- Montrer : un mot, une lettre, un nombre ----------
async function montrerEntree(entree, avecVoix = true, theme = THEME_DE[entree.emoji]) {
  const j = ++jeton;
  $('btn-tracer').hidden = true; if (Trace.actif) Trace.fermer();
  voirLumi();
  avatar?.mode(paletteAmb);
  avatar?.forme(entree.emoji);
  const objet = theme === 'couleurs' ? PAR_EMOJI.get(COULEUR_OBJET[entree.emoji]) : null;
  const phrase = objet
    ? { fr: `${majuscule(motDans(entree))}, comme ${nomComplet(objet)} !`, en: `${majuscule(motDans(entree))}, like the ${motDans(objet)}!`, ar: `${motDans(entree)}، مثل ${nomComplet(objet)}!` }[langue]
    : phraseDe(entree, theme);
  carteMot(entree, avecVoix ? phrase : '');
  try {
    if (avecVoix) await parler(phrase);
    if (objet) { avatar?.forme(objet.emoji); $('carte-emoji').textContent = entree.emoji + ' ' + objet.emoji; }
    await epeler(j);
    if (avecVoix) { await pause(250, j); await parler(nomComplet(entree)); }
  } catch {}
  revenirAuNuage(12000);
}

async function montrer(phrase, avecVoix = true) {
  const entree = chercher(phrase);
  if (entree) return montrerEntree(entree, avecVoix);
  const j = ++jeton, mot = phrase.trim();
  voirLumi();
  avatar?.mode(paletteAmb);
  avatar?.forme(mot);
  carte('✨', mot, LANGUES[langue].inconnu);
  try { if (avecVoix) await parler(LANGUES[langue].inconnu); await epeler(j); } catch {}
  revenirAuNuage(12000);
}

// Une lettre : la poussière dessine la lettre, puis se transforme en l'image du mot
async function montrerLettre(lettre, depuisTuile = false) {
  const j = ++jeton, L = LANGUES[langue];
  if (Trace.actif) Trace.fermer();
  voirLumi();
  const couple = L.alphabet.split(' ').map((x) => x.split(':')).find(([l]) => normaliser(l) === normaliser(lettre));
  const mot = !depuisTuile && couple ? couple[1] : null;
  const entree = mot ? chercher(mot) : null;
  avatar?.mode(paletteAmb);
  avatar?.forme(lettre);
  carte(entree?.emoji || '🔤', lettre, mot ? L.lettre('', mot).replace(/^[\s,،]+/, '') : '', false);
  try {
    await parler(L.lettre(lettre, mot));
    if (entree) {
      await pause(600, j);
      avatar?.forme(entree.emoji);
      carte(entree.emoji, mot, lettre);
      await epeler(j);
      // la lettre apprise reste surlignée dans le mot
      [...$('tuiles').children].forEach((t) => t.classList.toggle('cle', normaliser(t.textContent) === normaliser(lettre)));
    }
  } catch {}
  const b = $('btn-tracer');
  b.dataset.lettre = lettre; b.lastElementChild.textContent = L.tracer; b.hidden = false;
  revenirAuNuage(10000);
}

// Un nombre : la poussière dessine le chiffre, puis autant d'objets, et Lumi compte
async function montrerNombre(n) {
  const j = ++jeton, L = LANGUES[langue], objet = A_COMPTER[n - 1];
  $('btn-tracer').hidden = true; if (Trace.actif) Trace.fermer();
  voirLumi();
  const rangees = [];
  for (let i = 0; i < n; i += 5) rangees.push(objet.repeat(Math.min(5, n - i)));
  avatar?.mode(paletteAmb);
  avatar?.forme(L.chiffre(n));
  carte(L.chiffre(n), L.nombres[n - 1], '', false);
  try {
    await parler(L.nombres[n - 1]);
    await pause(500, j);
    avatar?.forme(rangees.join('\n'));
    carte(rangees.join(' '), L.nombres[n - 1], L.chiffre(n), false);
    // on compte : une tuile par objet, qui s'allume à chaque nombre
    for (let i = 1; i <= n; i++) {
      const t = document.createElement('div'); t.className = 'tuile'; t.textContent = L.chiffre(i); $('tuiles').appendChild(t);
    }
    const tuiles = [...$('tuiles').children];
    for (let i = 0; i < n; i++) {
      tuiles[i].classList.add('allumee'); avatar?.syllabe();
      await parler(L.nombres[i]);
      if (j !== jeton) return;
      tuiles[i].classList.remove('allumee'); tuiles[i].classList.add('vue');
    }
  } catch {}
  revenirAuNuage(10000);
}

// ---------- Tracer une lettre avec le doigt : des étoiles s'allument sur son passage ----------
const Trace = (() => {
  const cv = $('trace'), g = cv.getContext('2d');
  // Même matière que Lumi : des grains de lumière ronds et doux, en lumière additive
  const TEINTES = [[255, 255, 255], [160, 205, 255], [255, 170, 205], [150, 235, 210], [255, 225, 160]];
  const sprites = TEINTES.map(([r, v, b]) => {
    const c = document.createElement('canvas'); c.width = c.height = 32;
    const x = c.getContext('2d'), d = x.createRadialGradient(16, 16, 0, 16, 16, 16);
    d.addColorStop(0, `rgba(255,255,255,1)`); d.addColorStop(.25, `rgba(${r},${v},${b},.9)`); d.addColorStop(1, `rgba(${r},${v},${b},0)`);
    x.fillStyle = d; x.fillRect(0, 0, 32, 32); return c;
  });
  let actif = false, mode = 'lettre', grains = [], rayon = 20, guide = null, lettre = '', fini = false, appui = false;
  let particules = [], dessin = [], W = 0, H = 0, raf = 0, apresReussite = null, teinte = 1;

  function dimensionner() {
    const r = cv.getBoundingClientRect(), k = Math.min(devicePixelRatio, 2);
    W = r.width; H = r.height; cv.width = Math.round(W * k); cv.height = Math.round(H * k);
    g.setTransform(k, 0, 0, k, 0, 0);
  }

  // La lettre devient un nuage de grains pâles posés au hasard dans sa forme
  function preparerLettre(l) {
    const o = document.createElement('canvas'); o.width = Math.round(W); o.height = Math.round(H);
    const c = o.getContext('2d', { willReadFrequently: true });
    let t = Math.min(W, H) * .7;
    const police = (px) => `800 ${px}px "Baloo 2", "Baloo Bhaijaan 2", system-ui, sans-serif`;
    c.font = police(t);
    const larg = c.measureText(l).width;
    if (larg > W * .74) { t *= W * .74 / larg; c.font = police(t); }
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff';
    c.fillText(l, o.width / 2, o.height / 2 + t * .04);
    const px = c.getImageData(0, 0, o.width, o.height).data, pleins = [];
    for (let i = 0; i < o.width * o.height; i += 2) if (px[i * 4 + 3] > 128) pleins.push(i);
    rayon = Math.max(14, t * .09);
    grains = [];
    const n = Math.min(2600, Math.max(900, pleins.length / 10));
    for (let k = 0; k < n; k++) {
      const i = pleins[(Math.random() * pleins.length) | 0];
      grains.push({ x: i % o.width, y: (i / o.width) | 0, on: 0, allume: false, ph: Math.random() * 6,
                    t: (.5 + Math.random() * 1.1 + (Math.random() < .06 ? 1.4 : 0)), s: (Math.random() * TEINTES.length) | 0 });
    }
    guide = o;
  }

  function grain(x, y, taille, alpha, s) {
    g.globalAlpha = alpha;
    g.drawImage(sprites[s], x - taille, y - taille, taille * 2, taille * 2);
  }

  function poussiere(x, y, n, force = 1) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (.3 + Math.random() * 1.8) * force;
      particules.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - .2, vie: 1, r: .8 + Math.random() * 1.6, s: (Math.random() * TEINTES.length) | 0 });
    }
  }

  function toucher(x, y) {
    poussiere(x, y, 3, .5);
    if (mode === 'libre') {
      for (let i = 0; i < 6; i++) dessin.push({ x: x + (Math.random() - .5) * 14, y: y + (Math.random() - .5) * 14, t: .5 + Math.random() * 1.3, s: teinte, ph: Math.random() * 6 });
      if (dessin.length > 6000) dessin.splice(0, 4);
      return;
    }
    let nouveaux = 0;
    for (const p of grains) if (!p.allume && Math.hypot(p.x - x, p.y - y) < rayon) { p.allume = true; nouveaux++; }
    if (nouveaux) { avatar?.syllabe(); try { navigator.vibrate?.(4); } catch {} }
    const faites = grains.filter((p) => p.allume).length / grains.length;
    $('trace-progres').firstElementChild.style.width = Math.round(faites * 100) + '%';
    if (!fini && faites >= .88) reussite();
  }

  function reussite() {
    fini = true;
    grains.forEach((p) => { p.allume = true; });
    for (let i = 0; i < grains.length; i += 6) poussiere(grains[i].x, grains[i].y, 2, 1.6);
    apresReussite?.(lettre);
  }

  function dessiner() {
    const t = performance.now() / 1000;
    g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    if (mode === 'lettre') {
      for (const p of grains) {
        p.on += ((p.allume ? 1 : 0) - p.on) * .12;
        const scint = .6 + .4 * Math.sin(t * 2.5 + p.ph);
        const dx = Math.sin(t * .8 + p.ph) * 1.2 * p.on, dy = Math.cos(t * .7 + p.ph) * 1.2 * p.on;
        // éteint : grain pâle ; allumé : grain vif qui respire
        grain(p.x + dx, p.y + dy, p.t * (1.6 + p.on * 1.2), (.22 + .78 * p.on) * scint, p.on > .5 ? p.s : 0);
      }
    }
    for (const d of dessin) grain(d.x, d.y, d.t * 2.2, .75 + .25 * Math.sin(t * 3 + d.ph), d.s);
    particules = particules.filter((p) => (p.vie -= .018) > 0);
    for (const p of particules) {
      p.x += p.vx; p.y += p.vy; p.vx *= .97; p.vy *= .97;
      grain(p.x, p.y, p.r * 2 * p.vie, p.vie, p.s);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    if (actif) raf = requestAnimationFrame(dessiner);
  }

  const point = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', (e) => { appui = true; cv.setPointerCapture?.(e.pointerId); toucher(...point(e)); });
  cv.addEventListener('pointermove', (e) => {
    if (!appui) return;
    for (const ev of e.getCoalescedEvents?.() || [e]) toucher(...point(ev));
  });
  ['pointerup', 'pointercancel'].forEach((n) => cv.addEventListener(n, () => {
    appui = false;
    if (mode === 'libre') teinte = 1 + (teinte % (TEINTES.length - 1)); // chaque trait a sa couleur
  }));

  function ouvrir(nouveauMode, l, quandReussi) {
    mode = nouveauMode; lettre = l || ''; apresReussite = quandReussi; fini = false;
    particules = []; dessin = []; teinte = 1;
    ['trace', 'trace-fermer'].forEach((id) => { $(id).hidden = false; });
    $('trace-progres').hidden = mode !== 'lettre';
    $('trace-progres').firstElementChild.style.width = '0%';
    dimensionner();
    if (mode === 'lettre') preparerLettre(lettre); else { grains = []; guide = null; }
    avatar?.forme(null); avatar?.mode('fin'); // la poussière de Lumi se fait discrète pendant le dessin
    if (!actif) { actif = true; dessiner(); }
  }
  function fermer() {
    actif = false; cancelAnimationFrame(raf);
    ['trace', 'trace-fermer', 'trace-progres'].forEach((id) => { $(id).hidden = true; });
  }
  $('trace-fermer').onclick = fermer;
  return { ouvrir, fermer, get actif() { return actif; } };
})();

async function tracer(lettre) {
  diapo++; ++jeton;
  voirLumi();
  $('btn-tracer').hidden = true;
  carte('✍️', lettre, LANGUES[langue].tracer, false);
  parler(LANGUES[langue].tracer);
  Trace.ouvrir('lettre', lettre, async () => {
    const j = ++jeton;
    parler(LANGUES[langue].bravo);
    avatar?.mode('heureux');
    try { await pause(1800, j); } catch { return; }
    Trace.fermer();
    montrerLettre(lettre);
  });
}

// ---------- Du jour : la même lettre et le même nombre toute la journée ----------
function duJour() {
  const d = new Date(), jourAn = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
  const L = LANGUES[langue], lettres = L.alphabet.split(' ').map((x) => x.split(':')[0]);
  return {
    lettre: lettres[jourAn % lettres.length],
    nombre: (jourAn % 10) + 1,
    mot: MOTS[(jourAn * 7) % MOTS.length],
  };
}

// ---------- Sons d'ambiance, fabriqués en direct (aucun fichier, aucun droit d'auteur) ----------
const Ambiance = (() => {
  let ctx = null, maitre = null, busNotes = null, bruit = null, courante = 'musique', gen = 0, continus = [];
  let actif = true;
  try { actif = localStorage.getItem('lumi-son') !== 'non'; } catch {}

  function init() {
    if (ctx) return;
    ctx = audio || new (window.AudioContext || window.webkitAudioContext)();
    audio = ctx;
    maitre = ctx.createGain(); maitre.gain.value = 0; maitre.connect(ctx.destination);
    // un écho doux pour la boîte à musique
    busNotes = ctx.createGain(); busNotes.connect(maitre);
    const delai = ctx.createDelay(1), retour = ctx.createGain(), filtre = ctx.createBiquadFilter();
    delai.delayTime.value = .34; retour.gain.value = .38; filtre.type = 'lowpass'; filtre.frequency.value = 2400;
    busNotes.connect(delai); delai.connect(filtre); filtre.connect(retour); retour.connect(delai); filtre.connect(maitre);
    bruit = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const b = bruit.getChannelData(0); for (let i = 0; i < b.length; i++) b[i] = Math.random() * 2 - 1;
  }

  const plus = (s) => ctx.currentTime + s;
  function note(f, duree = 1.4, vol = .05, type = 'sine', quand = 0) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, plus(quand)); g.gain.exponentialRampToValueAtTime(vol, plus(quand + .02));
    g.gain.exponentialRampToValueAtTime(.0001, plus(quand + duree));
    o.connect(g).connect(busNotes); o.start(plus(quand)); o.stop(plus(quand + duree + .05));
  }
  function bruitFiltre(type, freq, q, vol, lfo = 0, profondeur = 0) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = bruit; s.loop = true; f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
    s.connect(f).connect(g).connect(maitre); s.start();
    continus.push(s);
    if (lfo) { // lente respiration du son (vagues, rafales)
      const o = ctx.createOscillator(), p = ctx.createGain();
      o.frequency.value = lfo; p.gain.value = vol * profondeur; o.connect(p).connect(g.gain); o.start(); continus.push(o);
    }
  }
  function oiseau() {
    const base = 2400 + Math.random() * 1600, n = 2 + ((Math.random() * 4) | 0);
    for (let i = 0; i < n; i++) {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = i * .11;
      o.frequency.setValueAtTime(base, plus(t)); o.frequency.exponentialRampToValueAtTime(base * (1.3 + Math.random() * .4), plus(t + .07));
      g.gain.setValueAtTime(.0001, plus(t)); g.gain.exponentialRampToValueAtTime(.025, plus(t + .015)); g.gain.exponentialRampToValueAtTime(.0001, plus(t + .09));
      o.connect(g).connect(maitre); o.start(plus(t)); o.stop(plus(t + .12));
    }
  }
  function grillon() {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 4300 + Math.random() * 400;
    for (let i = 0; i < 3; i++) {
      g.gain.setValueAtTime(.0001, plus(i * .09)); g.gain.exponentialRampToValueAtTime(.012, plus(i * .09 + .02)); g.gain.exponentialRampToValueAtTime(.0001, plus(i * .09 + .06));
    }
    o.connect(g).connect(maitre); o.start(); o.stop(plus(.35));
  }
  function bulle() {
    const o = ctx.createOscillator(), g = ctx.createGain(), f = 300 + Math.random() * 500;
    o.frequency.setValueAtTime(f, plus(0)); o.frequency.exponentialRampToValueAtTime(f * 2.4, plus(.12));
    g.gain.setValueAtTime(.0001, plus(0)); g.gain.exponentialRampToValueAtTime(.03, plus(.02)); g.gain.exponentialRampToValueAtTime(.0001, plus(.14));
    o.connect(g).connect(maitre); o.start(); o.stop(plus(.16));
  }
  function cloche() { [1320, 1980, 2640].forEach((f, i) => note(f, 2.2, .03 / (i + 1), 'sine')); }
  function tic() {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = bruit; f.type = 'highpass'; f.frequency.value = 3000; g.gain.setValueAtTime(.02, plus(0)); g.gain.exponentialRampToValueAtTime(.0001, plus(.03));
    s.connect(f).connect(g).connect(maitre); s.start(); s.stop(plus(.04));
  }

  // Boucles : chaque ambiance programme ses petits événements tant qu'elle est active
  function boucle(moi, min, max, faire) {
    const suivant = () => { if (moi !== gen) return; faire(); setTimeout(suivant, (min + Math.random() * (max - min)) * 1000); };
    setTimeout(suivant, Math.random() * min * 1000);
  }
  const GAMMES = {
    douce: [392, 440, 523, 587, 659, 784],          // pentatonique, jamais de fausse note
    claire: [523, 587, 659, 784, 880, 1047],
    grave: [262, 294, 330, 392, 440, 523],
  };
  const boite = (moi, gamme, min, max, vol = .045) => boucle(moi, min, max, () => {
    note(hasard(gamme), 1.8, vol, 'sine');
    if (Math.random() < .25) note(hasard(gamme) / 2, 2.4, vol * .7, 'triangle', .02);
  });
  const RECETTES = {
    musique:  (m) => boite(m, GAMMES.douce, .9, 2),
    mer:      (m) => { bruitFiltre('lowpass', 420, .7, .09, .08, .9); boite(m, GAMMES.grave, 2, 4, .035); boucle(m, 1.5, 5, bulle); },
    foret:    (m) => { bruitFiltre('bandpass', 700, .6, .035, .05, .7); boucle(m, 1.5, 5, oiseau); boite(m, GAMMES.douce, 2.5, 5, .03); },
    ferme:    (m) => { bruitFiltre('bandpass', 500, .5, .025, .04, .6); boucle(m, 3, 7, oiseau); boite(m, GAMMES.claire, 1.4, 3, .035); },
    jardin:   (m) => { boucle(m, 2.5, 6, oiseau); boite(m, GAMMES.claire, 1, 2.2, .04); },
    ecole:    (m) => { boite(m, GAMMES.claire, .7, 1.6, .04); boucle(m, 25, 40, cloche); },
    maison:   (m) => { boucle(m, 1, 1, tic); boite(m, GAMMES.douce, 1.6, 3, .04); },
    grillons: (m) => { boucle(m, .6, 1.8, grillon); boite(m, GAMMES.grave, 2.5, 5, .03); },
    vent:     (m) => { bruitFiltre('bandpass', 900, .5, .05, .06, .8); boite(m, GAMMES.douce, 1.6, 3.5, .035); },
  };

  // Vrais enregistrements (CC0, dossier sons/) quand ils existent, avec une boîte à musique discrète par-dessus.
  // S'ils ne se chargent pas (page ouverte hors ligne, fichier absent), les sons fabriqués prennent le relais.
  const FICHIERS = { mer: ['vagues', .5], foret: ['oiseaux', .55], ferme: ['oiseaux', .35], jardin: ['oiseaux', .3],
                     grillons: ['grillons', .35], vent: ['vent', .4], maison: ['pluie', .3] };
  const MUSIQUE_AVEC = { mer: ['grave', 2.5, 5, .03], foret: ['douce', 3, 6, .03], ferme: ['claire', 1.6, 3.2, .035], jardin: ['claire', 1.1, 2.4, .04],
                         grillons: ['grave', 2.5, 5, .03], vent: ['douce', 1.8, 3.5, .035], maison: ['douce', 1.6, 3, .04] };
  const tampons = {};
  function charger(nom) {
    if (!(nom in tampons)) {
      tampons[nom] = fetch(`sons/${nom}.mp3`)
        .then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then((b) => new Promise((ok, ko) => ctx.decodeAudioData(b, ok, ko)))
        .catch(() => null);
    }
    return tampons[nom];
  }
  function boucleFichier(tampon, vol) {
    const s = ctx.createBufferSource(), g = ctx.createGain();
    s.buffer = tampon; s.loop = true; g.gain.value = vol;
    s.connect(g).connect(maitre); s.start(); continus.push(s);
  }

  function demarrer() {
    const moi = ++gen, anciens = continus;
    continus = [];
    maitre.gain.setTargetAtTime(0, ctx.currentTime, .15);
    const f = FICHIERS[courante];
    const chargement = f ? charger(f[0]) : Promise.resolve(null);
    setTimeout(() => chargement.then((tampon) => {
      anciens.forEach((n) => { try { n.stop(); } catch {} n.disconnect(); });
      if (moi !== gen || !actif) return;
      if (tampon) {
        boucleFichier(tampon, f[1]);
        const [gamme, min, max, vol] = MUSIQUE_AVEC[courante];
        boite(moi, GAMMES[gamme], min, max, vol);
        if (courante === 'mer') boucle(moi, 3, 8, bulle);
      } else RECETTES[courante]?.(moi);
      maitre.gain.setTargetAtTime(muet ? 0 : .9, ctx.currentTime, .8);
    }), 450);
  }
  function jouer(nom) {
    if (nom === courante && gen) return;
    courante = nom;
    if (ctx && actif) demarrer();
  }
  function basculer() {
    actif = !actif;
    try { localStorage.setItem('lumi-son', actif ? 'oui' : 'non'); } catch {}
    if (actif) { init(); ctx.resume?.(); demarrer(); } else if (ctx) { gen++; maitre.gain.setTargetAtTime(0, ctx.currentTime, .2); continus.forEach((n) => { try { n.stop(); } catch {} }); continus = []; }
    return actif;
  }
  // la voix passe au-dessus de l'ambiance
  function baisser(oui) { if (ctx && actif && gen) maitre.gain.setTargetAtTime(muet ? 0 : oui ? .3 : .9, ctx.currentTime, .2); }
  // silence complet (pendant les comptines)
  let muet = false;
  function silence(oui) { muet = oui; if (ctx && actif && gen) maitre.gain.setTargetAtTime(oui ? 0 : .9, ctx.currentTime, oui ? .08 : .6); }
  // le navigateur n'autorise le son qu'après un premier geste
  const lancer = () => { if (actif && !gen) { debloquerAudio(); init(); ctx.resume?.(); demarrer(); } };
  ['touchend', 'click', 'keydown'].forEach((n) => document.addEventListener(n, lancer, true));
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend?.(); else if (actif) ctx.resume?.();
  });
  return { jouer, basculer, baisser, silence, get actif() { return actif; } };
})();

  let d = { etoiles: 0, mots: {}, skin: 'enfant' };
  try { d = { ...d, ...JSON.parse(localStorage.getItem(Profils.cle('lumi-progres')) || '{}') }; } catch {}
  const sauver = () => { try { localStorage.setItem(Profils.cle('lumi-progres'), JSON.stringify(d)); } catch {} Famille?.changement?.(); };
  function gagner(entree) {

// Une pluie d'étoiles qui jaillit du centre de l'écran
function fete() {
  for (let i = 0; i < 36; i++) {
    const e = document.createElement('span');
    e.className = 'confetti'; e.textContent = hasardDe(['⭐', '✨', '🌟', '💫', '🎉', '💖']);
    $('effets').appendChild(e);
    const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 280;
    e.animate([
      { transform: 'translate(-50%, -50%) scale(.3)', opacity: 1 },
      { transform: `translate(calc(-50% + ${(Math.cos(a) * d).toFixed(0)}px), calc(-50% + ${(Math.sin(a) * d).toFixed(0)}px)) scale(1.3) rotate(${(Math.random() * 360) | 0}deg)`, opacity: 0 },
    ], { duration: 1200 + Math.random() * 700, easing: 'cubic-bezier(.2, .8, .3, 1)' }).onfinish = () => e.remove();
  }
  avatar?.mode('heureux'); son('juste');
}

let quiz = null;
function quizTheme(id) {
  const liste = melanger(entrees(NOEUDS[id].mots)).slice(0, 5);
  quiz = { liste, i: 0, id, trouves: 0 };
  questionQuiz();
}
function questionQuiz() {
  const L = LANGUES[langue], m = quiz.liste[quiz.i];
  ++jeton; quiz.pause = false;
  $('btn-tracer').hidden = true;
  avatar?.mode(paletteAmb); avatar?.forme('question');
  carte('🎯', L.touche1(nomComplet(m)), `${quiz.i + 1} / ${quiz.liste.length}`, false);
  document.querySelectorAll('#panneau .objet').forEach((t) => t.classList.remove('juste', 'faux'));
  parler(L.touche1(nomComplet(m)));
}
async function repondreQuiz(m, t) {
  const L = LANGUES[langue], bon = quiz.liste[quiz.i];
  if (quiz.pause) return;
  if (m !== bon) {
    t.classList.remove('faux'); void t.offsetWidth; t.classList.add('faux'); son('faux');
    parler(L.pasCa(nomComplet(m), nomComplet(bon)));
    return;
  }
  const j = ++jeton;
  quiz.pause = true;
  t.classList.add('juste'); son('juste'); Progres.gagner(bon);
  avatar?.mode('heureux'); avatar?.forme(bon.emoji);
  carteMot(bon, L.bravo);
  try { await parler(`${L.bravo} ${majuscule(nomComplet(bon))} !`); await epeler(j); await pause(500, j); } catch { return; }
  if (!quiz) return;
  if (++quiz.i < quiz.liste.length) return questionQuiz();
  // fin : une pluie d'étoiles
  quiz = null;
  fete(); avatar?.forme('⭐');
  carte('🌟', L.super, '⭐ ⭐ ⭐ ⭐ ⭐', false);
  try { await parler(L.super); } catch {}
  revenirAuNuage(5000);
}

// Diaporama : Lumi montre chaque élément l'un après l'autre
async function toutVoir(liste) {
  const moi = ++diapo;
  for (const faire of liste) {
    if (moi !== diapo) return;
    await faire();
    if (moi !== diapo) return;
    await new Promise((r) => setTimeout(r, 900));
  }
}

  const p = $('panneau'), L = LANGUES[langue], n = NOEUDS[id];

  if (n.enfants) { n.enfants.forEach((e, i) => p.appendChild(tuileUnivers(e, i))); return; }
  if (n.type === 'album') return construireAlbum(p, L);
  let actions = [];
  const lettres = L.alphabet.split(' ').map((x) => x.split(':')[0]);
  if (n.type === 'dessin') {
    p.appendChild(tuile('✨', L.libre, dessinLibre, 'tout'));
    lettres.forEach((l, i) => p.appendChild(tuile(l, '✍️', () => tracer(l), 'lettre c' + (i % 4))));

  if (n.type === 'lettres') {
    actions = lettres.map((l, i) => { p.appendChild(tuile(l, '', () => montrerLettre(l), 'lettre c' + (i % 4))); return () => montrerLettre(l); });
  } else if (n.type === 'nombres') {
    actions = L.nombres.map((nom, i) => { p.appendChild(tuile(L.chiffre(i + 1), nom, () => montrerNombre(i + 1), 'lettre c' + (i % 4))); return () => montrerNombre(i + 1); });

function bulleCol(texte, couleur, dire = true) {
  const b = $('col-bulle');
  b.querySelector('.txt').textContent = texte;
  b.style.setProperty('--c', couleur || 'rgba(255,255,255,.15)');
  b.classList.remove('parle'); void b.offsetWidth; b.classList.add('parle');
  if (dire) parler(texte);
}
function nomCouleur(c) { const m = PAR_EMOJI.get(c[0]); return m ? majusculeSimple(motDans(m)) : ''; }
function choisirPinceau(c, dire = true) {
  pinceau = c;
  document.querySelectorAll('.pastille').forEach((p) => p.classList.toggle('actif', p.dataset.c === c[0]));
  $('feuille').style.setProperty('--pinceau', c[1]);
  if (dire) {

// Une miniature du dessin, avec les couleurs déjà posées
function miniDessin(k) {
  const d = document.createElement('div');
  d.className = 'mini';
  d.innerHTML = `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">${DESSINS[k]}</svg>`;
  const faites = Coloriages.lire(k);
  d.querySelectorAll('.z').forEach((z, i) => { if (faites[i]) z.style.fill = faites[i]; });
  return d;
}
function construireColoriage(k) {
  coloriageEnCours = k;
  const pal = $('palette');
  pal.innerHTML = '';
  COULEURS_PINCEAU.forEach((c) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pastille'; b.dataset.c = c[0]; b.style.setProperty('--c', c[1]);
    b.setAttribute('aria-label', nomCouleur(c));
    b.onclick = () => choisirPinceau(c);
    pal.appendChild(b);
  });
  choisirPinceau(pinceau, false);
  bulleCol(TXT_COL.choisis[langue], pinceau[1], false);
  const f = $('feuille');
  f.innerHTML = `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">${DESSINS[k]}</svg>`;
  const zones = [...f.querySelectorAll('.z')];
  const sauver = () => Coloriages.ecrire(k, zones.map((z) => z.style.fill ? z.dataset.c : null));
  const peindre = (z, couleur) => {
    z.dataset.c = couleur; z.style.fill = couleur;
    z.classList.remove('peint'); void z.getBoundingClientRect(); z.classList.add('peint');
  };
  let premiere = true;
  Coloriages.lire(k).forEach((c, i) => { if (c && zones[i]) { zones[i].dataset.c = c; zones[i].style.fill = c; } });
  zones.forEach((z) => {
    z.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      peindre(z, pinceau[1]); sauver();
      son('pop'); eclat(ev.clientX, ev.clientY, pinceau[1]);
      if (premiere) { premiere = false; bulleCol(nomCouleur(pinceau) + ' !', pinceau[1], false); }
    });
  });
  $('col-effacer').onclick = () => { zones.forEach((z) => { z.style.fill = ''; delete z.dataset.c; }); sauver(); son('pop'); bulleCol(TXT_COL.choisis[langue], pinceau[1], false); };
  // Baguette magique : les zones encore blanches se colorient une à une
  $('col-magie').onclick = () => {
    const vides = zones.filter((z) => !z.style.fill);
    const cibles = vides.length ? vides : zones;
    cibles.forEach((z, n) => setTimeout(() => {
      if (coloriageEnCours !== k) return;
      peindre(z, hasardDe(COULEURS_PINCEAU.slice(0, 8))[1]); son('pop');
      if (n === cibles.length - 1) sauver();
    }, n * 140));
    bulleCol('✨ ' + TXT_COL.magie[langue] + ' !', '#a855f7');
  };
  $('col-fini').onclick = () => {
    const m = PAR_EMOJI.get(NOEUDS['col-' + k].emoji);
    fete(); Progres.gagner(null);
    bulleCol(BEAU[langue], '#facc15');
    avatar?.forme(m.emoji); revenirAuNuage(4000);
  };
  $('col-fini').lastElementChild.textContent = TXT_COL.fini[langue];
  $('col-magie').lastElementChild.textContent = TXT_COL.magie[langue];
  // Les autres dessins, pour changer d'un doigt
  const autres = $('col-autres');
  autres.innerHTML = '';
  Object.keys(DESSINS).forEach((d) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'autre' + (d === k ? ' ici' : '');
    b.setAttribute('aria-label', NOEUDS['col-' + d].nom[langue]);
    b.appendChild(miniDessin(d));
    b.onclick = () => { if (d === k) return; pile.pop(); aller('col-' + d, false); bulleCol(NOEUDS['col-' + d].nom[langue], pinceau[1]); };
    autres.appendChild(b);
  });
}

const ReglesChant = (() => {
  let r = { langue: null, lent: false, boucle: false };
  try { r = { ...r, ...JSON.parse(localStorage.getItem('lumi-chansons') || '{}') }; } catch {}

// « C4:2 » → { f: fréquence, d: temps } ; le nombre de notes doit égaler le nombre de syllabes
function lireNotes(txt) {
  const DEMI = { C: -9, 'C#': -8, D: -7, 'D#': -6, E: -5, F: -4, 'F#': -3, G: -2, 'G#': -1, A: 0, 'A#': 1, B: 2 };
  return txt.trim().split(/\s+/).map((t) => {
    const [n, d] = t.split(':'), m = n.match(/^([A-G]#?)(\d)$/);
    return { f: 440 * 2 ** ((DEMI[m[1]] + (m[2] - 4) * 12) / 12), d: d ? parseFloat(d) : 1 };
  });
}
function preparerChanson(c) {
  return c.lignes.map(([paroles, notes]) => {
    const n = lireNotes(notes), mots = [];
    paroles.split(' ').forEach((m) => {
      // « ? » ou « ! » tout seuls se collent au mot d'avant, sans note
      if (!/\p{L}/u.test(m) && mots.length) mots[mots.length - 1].texte += '\u00a0' + m;
      else mots.push({ texte: m.replace(/--/g, '\u2011').replace(/-/g, ''), syl: m.replace(/--/g, '-').split('-').length });
    });
    const total = mots.reduce((s, m) => s + m.syl, 0);
    if (total !== n.length) console.warn(`Comptine « ${c.titre} » : ${total} syllabes pour ${n.length} notes dans « ${paroles} »`);
    return { mots, notes: n };
  });
}
// Une note de boîte à musique, envoyée dans le « bus » de la chanson (qu'on coupe d'un coup)
function noteBoite(bus, f, t, duree) {
  const o = audio.createOscillator(), o2 = audio.createOscillator(), g = audio.createGain(), g2 = audio.createGain();
  o.type = 'sine'; o2.type = 'sine'; o.frequency.value = f; o2.frequency.value = f * 2;
  g2.gain.value = .25; o2.connect(g2); g2.connect(g); o.connect(g); g.connect(bus);
  const fin = t + Math.max(.5, duree * 1.4);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.32, t + .015); g.gain.exponentialRampToValueAtTime(.0001, fin);
  o.start(t); o2.start(t); o.stop(fin + .05); o2.stop(fin + .05);
}
// Des petites notes de musique s'envolent de Lumi
function noteVole() {
  const sc = $('scene').getBoundingClientRect();
  if (sc.bottom < 0 || sc.height < 10) return;
  const e = document.createElement('span');
  e.className = 'note-vole'; e.textContent = hasardDe(['♪', '♫', '♩', '♬']);
  e.style.color = hasardDe(['#ffd166', '#7de2c3', '#ff8fab', '#7cc6fe', '#c3a6ff']);
  e.style.left = (sc.left + sc.width * (.3 + Math.random() * .4)) + 'px'; e.style.top = (sc.top + sc.height * .55) + 'px';
  $('effets').appendChild(e);
  const dx = (Math.random() - .5) * sc.width * .8, dy = -(sc.height * (.35 + Math.random() * .3));
  e.animate([{ transform: 'translate(-50%, 0) scale(.6)', opacity: 0 }, { opacity: 1, offset: .2 },
    { transform: `translate(calc(-50% + ${dx | 0}px), ${dy | 0}px) scale(1.3) rotate(${(Math.random() * 40 - 20) | 0}deg)`, opacity: 0 }],
    { duration: 1600 + Math.random() * 800, easing: 'ease-out' }).onfinish = () => e.remove();
}
let chant = null; // { id, bus, minuteurs }
function arreterChanson(finir = true) {
  if (!chant) return;
  const { bus, minuteurs } = chant;
  minuteurs.forEach(clearTimeout); chant = null;
  // on coupe tout de suite les notes déjà programmées
  try { bus.gain.setTargetAtTime(0, audio.currentTime, .03); setTimeout(() => bus.disconnect(), 200); } catch {}
  avatar?.parle(false);
  const b = $('ch-lecture'); if (b) b.textContent = '▶';
  document.querySelectorAll('.ch-mot.on').forEach((m) => m.classList.remove('on'));
  document.querySelectorAll('.ch-tuile.joue').forEach((x) => x.classList.remove('joue'));
  if (finir) { avatar?.mode('attente'); revenirAuNuage(800); }
}
function chanter(c) {

    bloc.appendChild(p); return s;
  });
  [...bloc.children].slice(0, 2).forEach((p) => p.classList.add('suivante'));
  $('ch-lecteur').classList.remove('vide');
  window.scrollTo({ top: 0, behavior: 'smooth' });

  $('ch-lecture').textContent = '⏸';
  document.querySelectorAll('.ch-tuile').forEach((x) => x.classList.toggle('joue', x.dataset.id === c.id));
  dernier = c;
  const bus = audio.createGain(); bus.gain.value = 1; bus.connect(audio.destination);

  const plus = (ms, fn) => moi.minuteurs.push(setTimeout(() => { if (chant === moi) fn(); }, ms));
  lignes.forEach((l, i) => {
    const dessin = c.lignes[i][2] || c.emoji;
    plus((t + .25) * 1000 - 60, () => {

      avatar?.forme(dessin);

function construireChansons() {
  const r = ReglesChant.get(), choix = r.langue || langue;
  const filtres = $('ch-filtres');

  [['toutes', '🌍'], ['fr', '🇫🇷 FR'], ['en', '🇬🇧 EN'], ['ar', '🇸🇦 AR'], ['tn', '🇹🇳 TN']].forEach(([k, t]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = t; b.className = 'puce' + (k === choix ? ' on' : '');
    b.onclick = () => { ReglesChant.set('langue', k); construireChansons(); };
    filtres.appendChild(b);
  });
  const liste = $('ch-liste');
  liste.innerHTML = '';
  CHANSONS.filter((c) => choix === 'toutes' || c.langue === choix).forEach((c, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ch-tuile u' + (i % 5) + (chant?.id === c.id ? ' joue' : '');
    b.innerHTML = '<span class="e"></span><span class="n"></span><span class="l"></span>';
    b.querySelector('.e').textContent = c.emoji; b.querySelector('.n').textContent = c.titre; b.querySelector('.l').textContent = DRAPEAU[c.langue];
    b.dir = RTL(c.langue) ? 'rtl' : 'ltr';
    b.dataset.id = c.id;
    const ok = Achat.ouvert || CHANSONS_LIBRES.has(c.id);
    if (!ok) { b.classList.add('ferme'); b.querySelector('.l').textContent += ' 🔒'; }
    b.onclick = () => (ok ? chanter(c) : proposerAchat());
    liste.appendChild(b);
  });
  $('ch-compte').textContent = '🎵 ' + liste.children.length + ' ' + { fr: 'comptines', en: 'songs', ar: 'أنشودة' }[langue];
  $('ch-lent').textContent = r.lent ? '🐢' : '🐇';
  $('ch-lent').setAttribute('aria-label', r.lent ? TXT_CH.lent[langue] : TXT_CH.vite[langue]);
  $('ch-lent').classList.toggle('on', r.lent);
  $('ch-boucle').textContent = '🔁';
  $('ch-boucle').setAttribute('aria-label', TXT_CH.boucle[langue]);
  if (!chant && !dernier) $('ch-titre').textContent = TXT_CH.choisis[langue];
  $('ch-boucle').classList.toggle('on', r.boucle);
}

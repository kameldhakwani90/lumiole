<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro Mac</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; color: #f4f6ff; cursor: none; user-select: none;
    font-family: "Segoe UI", system-ui, Roboto, sans-serif; background: #07090f; }
  /* même charte que l'appli : noir profond, lueurs grises qui dérivent lentement, manette blanche */
  .halo { position: fixed; border-radius: 50%; filter: blur(12vh); animation: flotte 18s ease-in-out infinite alternate; }
  .h1 { width: 80vh; height: 80vh; background: rgba(255,255,255,.08); right: -10vh; top: -25vh; }
  .h2 { width: 70vh; height: 70vh; background: rgba(120,140,190,.10); left: -20vh; bottom: -30vh; animation-delay: -7s; }
  @keyframes flotte { to { transform: translate(-6vw, 5vh) scale(1.12); } }
  main { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 8vw; }
  .logo { display: flex; align-items: center; gap: 2.4vw; }
  .logo .icone { width: 15vh; height: 15vh; border-radius: 3.6vh; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 25%, #2a2d36, #0b0c10 75%); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 2vh 5vh rgba(0,0,0,.6); }
  .logo .icone svg { width: 10vh; height: 10vh; }
  .logo h1 { font-size: 10vh; font-weight: 800; letter-spacing: -.02em; line-height: .95;
    background: linear-gradient(180deg, #fff 40%, #aab3c5); -webkit-background-clip: text; color: transparent; }
  .logo small { display: block; font-size: 2.2vh; font-weight: 700; letter-spacing: .4em; color: rgba(255,255,255,.55); margin-top: 1.2vh; }
  #etat { margin-top: 2vh; font-size: 2.6vh; color: rgba(232,236,255,.7); display: flex; align-items: center; gap: 1.2vw; min-height: 4vh; }
  .rond { width: 2.8vh; height: 2.8vh; border-radius: 50%; border: .35vh solid rgba(255,255,255,.2); border-top-color: #fff; animation: tourne 1s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg) } }
  #liste { display: flex; gap: 1.6vw; margin-top: 6vh; flex-wrap: wrap; }
  .carte { width: 26vw; padding: 3vh 2vw; border-radius: 2.4vh; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); transition: all .2s; }
  .carte b { display: block; font-size: 2.8vh; font-weight: 500; }
  .carte small { font-size: 1.8vh; color: rgba(232,236,255,.6); }
  .carte svg { width: 5vh; height: 5vh; margin-bottom: 1.6vh; opacity: .9; }
  .carte.sel { background: #fff; color: #0b0c10; transform: scale(1.06); box-shadow: 0 0 6vh rgba(255,255,255,.25); }
  .carte.sel small { color: rgba(11,16,32,.6); }
  #aide { margin-top: 5vh; font-size: 2vh; color: rgba(232,236,255,.55); line-height: 1.7; max-width: 60vw; opacity: 0; transition: opacity 1s; }
  #aide.visible { opacity: 1; }
  /* Saisie manuelle de l'adresse */
  #saisie { position: fixed; inset: 0; background: rgba(3,5,15,.85); backdrop-filter: blur(2vh); display: none; place-items: center; }
  #saisie.ouverte { display: grid; }
  .boite { width: 60vw; }
  .champ { font-size: 5vh; font-weight: 300; padding: 2vh 2vw; border-radius: 2vh; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); min-height: 10vh; font-family: ui-monospace, monospace; }
  .pave { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1vh; margin-top: 3vh; }
  .touche { height: 8vh; border-radius: 1.6vh; display: grid; place-items: center; font-size: 3vh; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); }
  .touche.sel { background: #fff; color: #0b1020; transform: scale(1.08); }
</style>
</head>
<body>
<div class="halo h1"></div><div class="halo h2"></div>
<main>
  <div class="logo">
    <div class="icone"><svg viewBox="0 0 24 24"><path fill="#fff" d="M7 6h10a5 5 0 0 1 4.9 4l1 5.5a2.6 2.6 0 0 1-4.6 2.1L16.5 15h-9l-1.8 2.6a2.6 2.6 0 0 1-4.6-2.1l1-5.5A5 5 0 0 1 7 6z"/><path fill="#0b0c10" d="M7 9h1.5v1.5H10V12H8.5v1.5H7V12H5.5v-1.5H7z"/><circle fill="#0b0c10" cx="16" cy="11" r="1"/><circle fill="#0b0c10" cx="18.5" cy="9.5" r="1"/></svg></div>
    <div><h1>RETRO MAC</h1><small>MAC · TV</small></div>
  </div>
  <div id="etat"><span class="rond"></span><span id="etat-texte">Recherche de ton Mac sur le Wi-Fi…</span></div>
  <div id="liste"></div>
  <div id="aide">Pas de Mac trouvé ? Ouvre l’appli <b>Retro Mac</b> sur ton Mac et vérifie que la Shield et le Mac sont sur le même Wi-Fi.
    Tu peux aussi entrer l’adresse affichée dans Retro Mac (par exemple 192.168.1.31).</div>
</main>
<div id="saisie"><div class="boite">
  <div class="champ" id="champ"></div>
  <div class="pave" id="pave"></div>
</div></div>
<script>
const $ = s => document.querySelector(s);
const macs = [];      // { nom, hote, port }
let index = 0, saisie = false, iTouche = 0, adresse = localStorage.getItem('adresse') || '192.168.1.';
const perdu = location.search.includes('perdu');
const dernier = localStorage.getItem('dernierMac');
const ICONE_MAC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>';
const ICONE_CLAVIER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>';

function cartes() { return [...macs.map(m => ({ type: 'mac', m })), { type: 'manuel' }]; }
function dessiner() {
  $('#liste').innerHTML = cartes().map((c, i) => c.type === 'mac'
    ? `<div class="carte ${i === index ? 'sel' : ''}">${ICONE_MAC}<b>${c.m.nom.replace(/</g, '&lt;')}</b><small>${c.m.hote}</small></div>`
    : `<div class="carte ${i === index ? 'sel' : ''}">${ICONE_CLAVIER}<b>Entrer l’adresse</b><small>si ton Mac n’apparaît pas</small></div>`).join('');
}
function connecter(m) {
  localStorage.setItem('dernierMac', m.nom);
  localStorage.setItem('derniereAdresse', JSON.stringify(m));
  $('#etat-texte').textContent = 'Connexion à ' + m.nom + '…';
  const url = `http://${m.hote}:${m.port}/`;
  // on vérifie que le Mac répond avant d'y aller
  fetch(url + 'api/catalogue', { cache: 'no-store' }).then(r => { if (!r.ok) throw 0; window.Shield ? Shield.ouvrir(url) : (location.href = url); })
    .catch(() => { $('#etat-texte').textContent = m.nom + ' ne répond pas. Retro Mac est-elle ouverte sur le Mac ?'; });
}

// appelé par l'appli Android quand un Mac est trouvé
window.macTrouve = m => {
  if (macs.some(x => x.nom === m.nom && x.hote === m.hote)) return;
  if (m.hote.includes(':')) return;   // on garde l'IPv4
  macs.push(m);
  dessiner();
  $('#etat-texte').textContent = macs.length > 1 ? 'Choisis ton Mac' : m.nom + ' trouvé';
  // un seul Mac (ou celui de la dernière fois) : on y va tout seul
  if (macs.length === 1 || m.nom === dernier) setTimeout(() => { if (!saisie && macs.length === 1 || m.nom === dernier) connecter(m); }, perdu ? 2500 : 900);
};
window.macPerdu = m => { const i = macs.findIndex(x => x.nom === m.nom); if (i >= 0) { macs.splice(i, 1); index = 0; dessiner(); } };
window.signal = s => { $('#etat-texte').textContent = s.message; };
if (perdu) $('#etat-texte').textContent = 'Connexion au Mac perdue. Nouvelle recherche…';
// la dernière adresse qui a marché : on la propose tout de suite si le Mac répond
try { const d = JSON.parse(localStorage.getItem('derniereAdresse') || 'null'); if (d) fetch(`http://${d.hote}:${d.port}/api/catalogue`, { cache: 'no-store' }).then(r => r.ok && window.macTrouve(d)).catch(() => {}); } catch (e) {}
setTimeout(() => $('#aide').classList.add('visible'), 8000);
dessiner();

// --- saisie manuelle ---
const TOUCHES = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '.', '⌫', 'Annuler', 'Se connecter'];
function dessinerSaisie() {
  $('#champ').textContent = adresse + '▏';
  $('#pave').innerHTML = TOUCHES.map((t, i) => `<div class="touche ${i === iTouche ? 'sel' : ''}" style="${t.length > 2 ? 'grid-column: span 3; font-size: 2.4vh' : ''}">${t}</div>`).join('');
}
function agirSaisie(a) {
  const col = 6;
  if (a === 'gauche' && iTouche > 0) iTouche--;
  if (a === 'droite' && iTouche < TOUCHES.length - 1) iTouche++;
  if (a === 'haut') iTouche = Math.max(0, iTouche - col);
  if (a === 'bas') iTouche = Math.min(TOUCHES.length - 1, iTouche + col);
  if (a === 'retour') { saisie = false; $('#saisie').classList.remove('ouverte'); return; }
  if (a === 'ok') {
    const t = TOUCHES[iTouche];
    if (t === '⌫') adresse = adresse.slice(0, -1);
    else if (t === 'Annuler') { saisie = false; $('#saisie').classList.remove('ouverte'); return; }
    else if (t === 'Se connecter') { localStorage.setItem('adresse', adresse); saisie = false; $('#saisie').classList.remove('ouverte'); const [h, p] = adresse.split(':'); return connecter({ nom: h, hote: h, port: p || 8642 }); }
    else if (adresse.length < 21) adresse += t;
  }
  dessinerSaisie();
}

function agir(a) {
  if (saisie) return agirSaisie(a);
  const c = cartes();
  if (a === 'gauche' && index > 0) index--;
  if (a === 'droite' && index < c.length - 1) index++;
  if (a === 'ok') {
    const x = c[index];
    if (x.type === 'mac') return connecter(x.m);
    saisie = true; iTouche = 0; $('#saisie').classList.add('ouverte'); dessinerSaisie(); return;
  }
  if (a === 'retour' && window.Shield) return Shield.quitter();
  dessiner();
}
const touches = { ArrowLeft: 'gauche', ArrowRight: 'droite', ArrowUp: 'haut', ArrowDown: 'bas', Enter: 'ok', Escape: 'retour', GoBack: 'retour' };
addEventListener('keydown', e => { const a = touches[e.key]; if (a) { e.preventDefault(); agir(a); } else if (saisie && /^[0-9.:]$/.test(e.key)) { adresse += e.key; dessinerSaisie(); } });
// bouton A de la manette
let tenu = false;
(function boucle() {
  const p = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(Boolean);
  const a = p && p.buttons[0] && p.buttons[0].pressed;
  if (a && !tenu) agir('ok');
  tenu = a;
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>

# Construit l'app Android de Lumiole (téléphone, tablette, télé) et la publie à un lien direct :
# https://github.com/kameldhakwani90/lumiole/releases/download/android/lumiole.apk
name: Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'app/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest   # le SDK Android y est déjà installé
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run web && npx cap sync android
        env:
          LUMI_SOURCE: '..'
      - name: Clé de signature (secrets du dépôt)
        env:
          LUMI_KEYSTORE_B64: ${{ secrets.LUMI_KEYSTORE_B64 }}
        run: if [ -n "$LUMI_KEYSTORE_B64" ]; then echo "$LUMI_KEYSTORE_B64" | base64 -d > android/app/lumiole.keystore; else echo "::warning::Secret LUMI_KEYSTORE_B64 absent : APK signé avec une clé debug (mise à jour impossible sans désinstaller)"; fi
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
        env:
          LUMI_KEY_PASS: ${{ secrets.LUMI_KEY_PASS }}
      - name: Publier l'APK (release « android »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk lumiole.apk
          gh release view android >/dev/null 2>&1 || gh release create android --title "Lumiole pour Android (test)" --notes "Version de test : téléphone, tablette et télé Android. Télécharger lumiole.apk."
          gh release upload android lumiole.apk --clobber

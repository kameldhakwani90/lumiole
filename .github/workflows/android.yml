# Construit l'app Android de Lumiole (téléphone, tablette, télé) et la publie à un lien direct :
# https://github.com/kameldhakwani90/lumiole/releases/download/android/lumiole.apk
name: Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'app/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest   # le SDK Android y est déjà installé
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run web && npx cap sync android
        env:
          LUMI_SOURCE: '..'
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - name: Publier l'APK (release « android »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk lumiole.apk
          gh release view android >/dev/null 2>&1 || gh release create android --title "Lumiole pour Android (test)" --notes "Version de test : téléphone, tablette et télé Android. Télécharger lumiole.apk."
          gh release upload android lumiole.apk --clobber

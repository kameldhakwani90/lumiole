# Construit l'appli Shield « Rétro » (jouer sur la télé aux jeux lancés sur le Mac) et la publie à un lien direct :
# https://github.com/kameldhakwani90/lumiole/releases/download/retro/retro-shield.apk
name: Rétro Shield
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/retro-shield']
    paths: ['retro-shield/**', '.github/workflows/retro-shield.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest   # le SDK Android y est déjà installé
    defaults:
      run:
        working-directory: retro-shield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle assembleDebug --no-daemon
      - name: Publier l'APK (release « retro »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk retro-shield.apk
          gh release view retro >/dev/null 2>&1 || gh release create retro --title "Rétro pour Shield TV (test)" --notes "Appli Android TV : affiche les jeux lancés sur le Mac (Rétro Mac). Télécharger retro-shield.apk."
          gh release upload retro retro-shield.apk --clobber
